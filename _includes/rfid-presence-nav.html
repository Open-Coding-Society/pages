<style>
.rfid-presence-infograph {
  --rp-surface: color-mix(in srgb, var(--rp-text) 6%, var(--rp-bg));
  --rp-surface-strong: color-mix(in srgb, var(--rp-text) 12%, var(--rp-bg));
  --rp-border-strong: color-mix(in srgb, var(--rp-text) 18%, transparent);
  --rp-success: var(--rp-accent);
  --rp-warning: var(--rp-accent);
  --rp-danger: var(--rp-accent);
}

.rfid-presence-infograph .rfid-presence-question {
  font-size: 1.05rem;
  line-height: 1.7;
  margin: 0;
}

.rfid-presence-infograph .rfid-presence-diagram {
  margin: 1rem 0 1.25rem;
  padding: 1.25rem;
  overflow-x: auto;
  background: var(--rp-surface);
  border: 1px solid var(--rp-card-border);
  border-radius: 12px;
}

.rfid-presence-infograph .rfid-presence-diagram .mermaid {
  display: flex;
  justify-content: center;
  margin: 0;
}

.rfid-presence-infograph .rfid-presence-table-wrap {
  overflow-x: auto;
  margin-top: 1rem;
}

.rfid-presence-infograph .rfid-presence-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.95rem;
}

.rfid-presence-infograph .rfid-presence-table th,
.rfid-presence-infograph .rfid-presence-table td {
  text-align: left;
  padding: 0.9rem 1rem;
  border-bottom: 1px solid var(--rp-card-border);
  vertical-align: top;
}

.rfid-presence-infograph .rfid-presence-table th {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--rp-text-muted);
}

.rfid-presence-infograph .rfid-presence-table td {
  color: var(--rp-text-muted);
  line-height: 1.5;
}

.rfid-presence-infograph .rfid-presence-table tr:last-child td { border-bottom: none; }
.rfid-presence-infograph .rfid-presence-table a { text-decoration: none; }
.rfid-presence-infograph .rfid-presence-table a:hover { text-decoration: underline; text-underline-offset: 2px; }

.rfid-presence-infograph .rfid-presence-pill {
  display: inline-block;
  padding: 0.25rem 0.75rem;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  border-radius: 999px;
  border: 1px solid var(--rp-border-strong);
  background: var(--rp-surface-strong);
  color: var(--rp-text);
}

.rfid-presence-infograph .rfid-presence-pill-good,
.rfid-presence-infograph .rfid-presence-pill-warn,
.rfid-presence-infograph .rfid-presence-pill-bad { border-color: var(--rp-accent); background: var(--rp-accent-soft); color: var(--rp-accent); }
.rfid-presence-infograph .rfid-presence-pill-neutral { border-color: var(--rp-border-strong); background: var(--rp-surface); color: var(--rp-text-muted); }

.rfid-presence-infograph .rfid-presence-checklist {
  list-style: none;
  padding: 0;
  margin: 0;
}

.rfid-presence-infograph .rfid-presence-checklist li {
  display: flex;
  align-items: flex-start;
  gap: 0.65rem;
  padding: 0.55rem 0;
  border-bottom: 1px solid var(--rp-card-border);
  line-height: 1.5;
  color: var(--rp-text-muted);
}

.rfid-presence-infograph .rfid-presence-checklist li:last-child { border-bottom: none; }

.rfid-presence-infograph .rfid-presence-checklist .rfid-presence-box {
  flex-shrink: 0;
  width: 1.1rem;
  height: 1.1rem;
  border-radius: 0.3rem;
  border: 1.5px solid var(--rp-border-strong);
  margin-top: 0.15rem;
}

.rfid-presence-infograph .rfid-presence-checklist li.done .rfid-presence-box { border-color: var(--rp-success); background: var(--rp-success-soft); }
.rfid-presence-infograph .rfid-presence-checklist li.open .rfid-presence-box { border-color: var(--rp-warning); }

.rfid-presence-infograph .rfid-presence-callout {
  margin-top: 1rem;
  padding: 0.9rem 1.1rem;
  border-radius: 12px;
  font-size: 0.9rem;
  line-height: 1.6;
  color: var(--rp-text-muted);
  background: var(--rp-surface);
  border: 1px solid var(--rp-card-border);
}

.rfid-presence-infograph .rfid-presence-callout a { color: var(--rp-accent); }

.rfid-presence-infograph .rfid-presence-entity-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 0.6rem;
}

.rfid-presence-infograph .rfid-presence-entity-list li {
  background: var(--rp-surface);
  border: 1px solid var(--rp-card-border);
  border-radius: 0.5rem;
  padding: 0.6rem 0.85rem;
  font-size: 0.85rem;
  color: var(--rp-text-muted);
  line-height: 1.5;
}

.rfid-presence-infograph .rfid-presence-entity-list strong { color: var(--rp-text); }

.rfid-presence-infograph .rfid-presence-hub-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1.25rem;
  margin-top: 1.25rem;
}

.rfid-presence-infograph .rfid-presence-hub-card {
  display: block;
  padding: 1.5rem;
  border-radius: 18px;
  border: 1px solid var(--rp-border-strong);
  background: var(--rp-surface);
  color: inherit;
  text-decoration: none;
  transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
}

.rfid-presence-infograph .rfid-presence-hub-card:hover {
  background: var(--rp-surface-strong);
  border-color: var(--rp-accent);
  transform: translateY(-2px);
}

.rfid-presence-infograph .rfid-presence-hub-card .rfid-presence-project-title { margin: 0.25rem 0 0.5rem; font-size: 1.2rem; font-weight: 800; color: var(--rp-text); }
.rfid-presence-infograph .rfid-presence-hub-card p { color: var(--rp-text-muted); margin: 0; }

.rfid-presence-infograph .rfid-presence-stage-nav {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 0.75rem;
  margin-bottom: 2rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--rp-card-border);
}

.rfid-presence-infograph .rfid-presence-phase-crumb {
  display: inline-block;
  margin-bottom: 1.25rem;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--rp-text-muted);
  text-decoration: none;
}
.rfid-presence-infograph .rfid-presence-phase-crumb:hover { color: var(--rp-accent); text-decoration: underline; }

.rfid-presence-infograph .rfid-presence-pager {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
  margin-top: 1rem;
}

.rfid-presence-infograph .rfid-presence-pager-link {
  display: block;
  padding: 1rem 1.25rem;
  border-radius: 14px;
  border: 1px solid var(--rp-border-strong);
  background: var(--rp-surface);
  color: var(--rp-text-muted);
  text-decoration: none;
  transition: background 0.2s ease, border-color 0.2s ease;
}
.rfid-presence-infograph .rfid-presence-pager-link:hover { background: var(--rp-surface-strong); border-color: var(--rp-accent); color: var(--rp-text); }
.rfid-presence-infograph .rfid-presence-pager-link.next { text-align: right; }

@media (max-width: 900px) {
  .rfid-presence-infograph .rfid-presence-stage-nav,
  .rfid-presence-infograph .rfid-presence-hub-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {
  .rfid-presence-infograph .rfid-presence-stage-nav,
  .rfid-presence-infograph .rfid-presence-hub-grid,
  .rfid-presence-infograph .rfid-presence-pager {
    grid-template-columns: 1fr;
  }
}
</style>

<nav class="rfid-presence-stage-nav" aria-label="RFID Presence navigation">
  <a href="/capstone/rfid-presence/" class="ocs__btn pill{% if page.rp_active == 'hub' %} alert-green fill{% endif %}"{% if page.rp_active == 'hub' %} aria-current="page"{% endif %}>Overview</a>
  <a href="/capstone/rfid-presence/summary/" class="ocs__btn pill{% if page.rp_active == 'summary' %} alert-green fill{% endif %}"{% if page.rp_active == 'summary' %} aria-current="page"{% endif %}>Project Summary</a>
  <a href="/capstone/rfid-presence/technical/" class="ocs__btn pill{% if page.rp_active == 'technical' %} alert-green fill{% endif %}"{% if page.rp_active == 'technical' %} aria-current="page"{% endif %}>Technical Detail</a>
  <a href="/capstone/rfid-presence/phases/" class="ocs__btn pill{% if page.rp_active == 'phases' %} alert-green fill{% endif %}"{% if page.rp_active == 'phases' %} aria-current="page"{% endif %}>Phases</a>
  <a href="/capstone/rfid-presence/funding/" class="ocs__btn pill{% if page.rp_active == 'funding' %} alert-green fill{% endif %}"{% if page.rp_active == 'funding' %} aria-current="page"{% endif %}>Funding</a>
</nav>
