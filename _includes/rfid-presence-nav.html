<style>
.rfid-presence-infograph .rfid-presence-question {
  font-size: 1.05rem;
  line-height: 1.7;
  margin: 0;
}

.rfid-presence-infograph .rfid-presence-diagram {
  margin: 1rem 0 1.25rem;
  padding: 1.25rem;
  overflow-x: auto;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
}

.rfid-presence-infograph .rfid-presence-diagram .mermaid {
  display: flex;
  justify-content: center;
  margin: 0;
}

.rfid-presence-infograph .rfid-presence-table-wrap {
  overflow-x: auto;
  margin-top: 1rem;
}

.rfid-presence-infograph .rfid-presence-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.95rem;
}

.rfid-presence-infograph .rfid-presence-table th,
.rfid-presence-infograph .rfid-presence-table td {
  text-align: left;
  padding: 0.9rem 1rem;
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  vertical-align: top;
}

.rfid-presence-infograph .rfid-presence-table th {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.75);
}

.rfid-presence-infograph .rfid-presence-table td {
  color: rgba(255, 255, 255, 0.75);
  line-height: 1.5;
}

.rfid-presence-infograph .rfid-presence-table tr:last-child td { border-bottom: none; }
.rfid-presence-infograph .rfid-presence-table a { text-decoration: none; }
.rfid-presence-infograph .rfid-presence-table a:hover { text-decoration: underline; text-underline-offset: 2px; }

.rfid-presence-infograph .rfid-presence-pill {
  display: inline-block;
  padding: 0.25rem 0.75rem;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.08);
  color: #ffffff;
}

.rfid-presence-infograph .rfid-presence-pill-good    { border-color: rgba(34, 197, 94, 0.5); background: rgba(34, 197, 94, 0.15); color: #4ade80; }
.rfid-presence-infograph .rfid-presence-pill-warn    { border-color: rgba(245, 158, 11, 0.5); background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
.rfid-presence-infograph .rfid-presence-pill-bad     { border-color: rgba(239, 68, 68, 0.5); background: rgba(239, 68, 68, 0.15); color: #f87171; }
.rfid-presence-infograph .rfid-presence-pill-neutral { border-color: rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.06); color: rgba(255, 255, 255, 0.75); }

.rfid-presence-infograph .rfid-presence-checklist {
  list-style: none;
  padding: 0;
  margin: 0;
}

.rfid-presence-infograph .rfid-presence-checklist li {
  display: flex;
  align-items: flex-start;
  gap: 0.65rem;
  padding: 0.55rem 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  line-height: 1.5;
  color: rgba(255, 255, 255, 0.75);
}

.rfid-presence-infograph .rfid-presence-checklist li:last-child { border-bottom: none; }

.rfid-presence-infograph .rfid-presence-checklist .rfid-presence-box {
  flex-shrink: 0;
  width: 1.1rem;
  height: 1.1rem;
  border-radius: 0.3rem;
  border: 1.5px solid rgba(255, 255, 255, 0.3);
  margin-top: 0.15rem;
}

.rfid-presence-infograph .rfid-presence-checklist li.done .rfid-presence-box { border-color: #4ade80; background: rgba(34, 197, 94, 0.2); }
.rfid-presence-infograph .rfid-presence-checklist li.open .rfid-presence-box { border-color: #fbbf24; }

.rfid-presence-infograph .rfid-presence-callout {
  margin-top: 1rem;
  padding: 0.9rem 1.1rem;
  border-radius: 12px;
  font-size: 0.9rem;
  line-height: 1.6;
  color: rgba(255, 255, 255, 0.75);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
}

.rfid-presence-infograph .rfid-presence-callout a { color: #ffffff; }

.rfid-presence-infograph .rfid-presence-entity-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 0.6rem;
}

.rfid-presence-infograph .rfid-presence-entity-list li {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 0.5rem;
  padding: 0.6rem 0.85rem;
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.75);
  line-height: 1.5;
}

.rfid-presence-infograph .rfid-presence-entity-list strong { color: #ffffff; }

.rfid-presence-infograph .rfid-presence-hub-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1.25rem;
  margin-top: 1.25rem;
}

.rfid-presence-infograph .rfid-presence-hub-card {
  display: block;
  padding: 1.5rem;
  border-radius: 18px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(255, 255, 255, 0.04);
  color: inherit;
  text-decoration: none;
  transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
}

.rfid-presence-infograph .rfid-presence-hub-card:hover {
  background: rgba(255, 255, 255, 0.09);
  border-color: rgba(255, 255, 255, 0.28);
  transform: translateY(-2px);
}

.rfid-presence-infograph .rfid-presence-hub-card .rfid-presence-project-title { margin: 0.25rem 0 0.5rem; font-size: 1.2rem; font-weight: 800; color: #ffffff; }
.rfid-presence-infograph .rfid-presence-hub-card p { color: rgba(255, 255, 255, 0.75); margin: 0; }

.rfid-presence-infograph .rfid-presence-stage-nav {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 0.75rem;
  margin-bottom: 2rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
}

.rfid-presence-infograph .rfid-presence-stage-nav-link {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0.75rem 0.5rem;
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(255, 255, 255, 0.05);
  color: rgba(255, 255, 255, 0.75);
  font-weight: 600;
  font-size: 0.85rem;
  text-decoration: none;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}

.rfid-presence-infograph .rfid-presence-stage-nav-link:hover { color: #ffffff; background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.24); }
.rfid-presence-infograph .rfid-presence-stage-nav-link.is-active { color: #ffffff; background: rgba(255, 255, 255, 0.16); border-color: rgba(255, 255, 255, 0.32); }

.rfid-presence-infograph .rfid-presence-phase-crumb {
  display: inline-block;
  margin-bottom: 1.25rem;
  font-size: 0.85rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.75);
  text-decoration: none;
}
.rfid-presence-infograph .rfid-presence-phase-crumb:hover { color: #ffffff; text-decoration: underline; }

.rfid-presence-infograph .rfid-presence-pager {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
  margin-top: 1rem;
}

.rfid-presence-infograph .rfid-presence-pager-link {
  display: block;
  padding: 1rem 1.25rem;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(255, 255, 255, 0.04);
  color: rgba(255, 255, 255, 0.75);
  text-decoration: none;
  transition: background 0.2s ease, border-color 0.2s ease;
}
.rfid-presence-infograph .rfid-presence-pager-link:hover { background: rgba(255, 255, 255, 0.09); border-color: rgba(255, 255, 255, 0.28); color: #ffffff; }
.rfid-presence-infograph .rfid-presence-pager-link.next { text-align: right; }

@media (max-width: 900px) {
  .rfid-presence-infograph .rfid-presence-stage-nav,
  .rfid-presence-infograph .rfid-presence-hub-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {
  .rfid-presence-infograph .rfid-presence-stage-nav,
  .rfid-presence-infograph .rfid-presence-hub-grid,
  .rfid-presence-infograph .rfid-presence-pager {
    grid-template-columns: 1fr;
  }
}
