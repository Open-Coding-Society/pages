<style>
.rfid-presence-infograph {
  --rp-surface: color-mix(in srgb, var(--rp-text) 6%, var(--rp-bg));
  --rp-surface-strong: color-mix(in srgb, var(--rp-text) 12%, var(--rp-bg));
  --rp-border-strong: color-mix(in srgb, var(--rp-text) 18%, transparent);
  --rp-success: var(--rp-accent);
  --rp-warning: var(--rp-accent);
  --rp-danger: var(--rp-accent);
}

.rfid-presence-infograph .rfid-presence-question {
  font-size: 1.05rem;
  line-height: 1.7;
  margin: 0;
}

.rfid-presence-infograph .rfid-presence-table-wrap {
  overflow-x: auto;
  margin-top: 1rem;
}

.rfid-presence-infograph .rfid-presence-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.95rem;
}

.rfid-presence-infograph .rfid-presence-table th,
.rfid-presence-infograph .rfid-presence-table td {
  text-align: left;
  padding: 0.9rem 1rem;
  border-bottom: 1px solid var(--rp-card-border);
  vertical-align: top;
}

.rfid-presence-infograph .rfid-presence-table th {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--rp-text-muted);
}

.rfid-presence-infograph .rfid-presence-table td {
  color: var(--rp-text-muted);
  line-height: 1.5;
}

.rfid-presence-infograph .rfid-presence-table tr:last-child td { border-bottom: none; }
.rfid-presence-infograph .rfid-presence-table a { text-decoration: none; }
.rfid-presence-infograph .rfid-presence-table a:hover { text-decoration: underline; text-underline-offset: 2px; }

.rfid-presence-infograph .rfid-presence-pill {
  display: inline-block;
  padding: 0.25rem 0.75rem;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  border-radius: 999px;
  border: 1px solid var(--rp-border-strong);
  background: var(--rp-surface-strong);
  color: var(--rp-text);
}

.rfid-presence-infograph .rfid-presence-pill-good,
.rfid-presence-infograph .rfid-presence-pill-warn,
.rfid-presence-infograph .rfid-presence-pill-bad { border-color: var(--rp-accent); background: var(--rp-accent-soft); color: var(--rp-accent); }
.rfid-presence-infograph .rfid-presence-pill-neutral { border-color: var(--rp-border-strong); background: var(--rp-surface); color: var(--rp-text-muted); }

.rfid-presence-infograph .rfid-presence-checklist {
  list-style: none;
  padding: 0;
  margin: 0;
}

.rfid-presence-infograph .rfid-presence-checklist li {
  display: flex;
  align-items: flex-start;
  gap: 0.65rem;
  padding: 0.55rem 0;
  border-bottom: 1px solid var(--rp-card-border);
  line-height: 1.5;
  color: var(--rp-text-muted);
}

.rfid-presence-infograph .rfid-presence-checklist li:last-child { border-bottom: none; }

.rfid-presence-infograph .rfid-presence-checklist .rfid-presence-box {
  flex-shrink: 0;
  width: 1.1rem;
  height: 1.1rem;
  border-radius: 0.3rem;
  border: 1.5px solid var(--rp-border-strong);
  margin-top: 0.15rem;
}

.rfid-presence-infograph .rfid-presence-checklist li.done .rfid-presence-box { border-color: var(--rp-success); background: var(--rp-success-soft); }
.rfid-presence-infograph .rfid-presence-checklist li.open .rfid-presence-box { border-color: var(--rp-warning); }

.rfid-presence-infograph .rfid-presence-stage-nav {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 0.75rem;
  margin-bottom: 2rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--rp-card-border);
}

@media (max-width: 900px) {
  .rfid-presence-infograph .rfid-presence-stage-nav {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {
  .rfid-presence-infograph .rfid-presence-stage-nav {
    grid-template-columns: 1fr;
  }
}
</style>

<nav class="rfid-presence-stage-nav" aria-label="RFID Presence navigation">

  <a href="/capstone/rfid-presence/summary/" class="ocs__btn pill{% if page.rp_active == 'summary' %} accent fill{% endif %}"{% if page.rp_active == 'summary' %} aria-current="page"{% endif %}>Project Summary</a>
  <a href="/capstone/rfid-presence/technical/" class="ocs__btn pill{% if page.rp_active == 'technical' %} accent fill{% endif %}"{% if page.rp_active == 'technical' %} aria-current="page"{% endif %}>Technical Detail</a>
  <a href="/capstone/rfid-presence/phases/" class="ocs__btn pill{% if page.rp_active == 'phases' %} accent fill{% endif %}"{% if page.rp_active == 'phases' %} aria-current="page"{% endif %}>Phases</a>
  <a href="/capstone/rfid-presence/funding/" class="ocs__btn pill{% if page.rp_active == 'funding' %} accent fill{% endif %}"{% if page.rp_active == 'funding' %} aria-current="page"{% endif %}>Funding</a>
</nav>
