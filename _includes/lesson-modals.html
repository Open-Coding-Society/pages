<!-- LESSON PLAYER MODALS -->

<!-- Timeline modal overlay -->
<div class="timeline-modal-overlay" id="timeline-modal-overlay"></div>

<!-- Timeline modal (mobile only) -->
<div class="timeline-modal" id="timeline-modal">
  <div class="timeline-modal-header">
    <h3>Course Timeline</h3>
    <button class="timeline-close-btn" id="timeline-close-btn" type="button">
      <i class="fas fa-times"></i>
    </button>
  </div>
  <div class="course-mobile-nav">
    {% include course-nav.html %}
    <nav class="ocs__links" aria-label="Course home">
      <a class="ocs__btn small accent{% if page.player_page.kind == 'home' %} fill{% endif %}" href="{{ site.baseurl }}/navigation/courses/{{ current_course }}/"{% if page.player_page.kind == 'home' %} aria-current="page"{% endif %}>Calendar / Announcements</a>
      <a class="ocs__btn small accent{% if page.player_page.kind == 'blogs' %} fill{% endif %}" href="{{ site.baseurl }}/{{ current_course }}/blogs/"{% if page.player_page.kind == 'blogs' %} aria-current="page"{% endif %}>Blogs</a>
    </nav>
  </div>
  <div class="timeline-modal-content" id="timeline-modal-content">
    <!-- Sprint cards will be populated by JavaScript -->
  </div>
</div>
