<!-- Class Announcement Chat: always-open WebSocket chat for the whole course. -->
<!-- One group per course, e.g. "csa-announcements", "csp-announcements". -->
<!-- Reuses the same STOMP/SockJS backend as _includes/lesson_chat.html and -->
<!-- _includes/group_dashboard.html (Open-Coding-Society/spring's /api/groups + -->
<!-- /ws-chat). The group is created automatically on first use if it doesn't -->
<!-- exist yet, so no manual DB seeding is required. -->

<div id="announcementChat" class="announcement-chat" data-course="{{ page.course }}" style="margin: 1.5em 0; border: 1px solid; border-radius: 8px; padding: 1em;">
  <div style="display:flex; align-items:center; justify-content:space-between; gap:.5em; flex-wrap:wrap;">
    <h2 style="margin:0; font-size:1.1em;">📢 {{ page.course | upcase }} Announcements <span id="announcementChatStatus" style="font-weight:normal; font-size:.8em;">loading…</span></h2>
  </div>
  <p style="margin:.25em 0 0; font-size:.85em; opacity:.75;">Class-wide chat for this course — announcements, questions, anything that isn't week-specific.</p>
  <div id="announcementChatMessages" aria-live="polite" style="height:16em;overflow-y:auto;border:1px solid;padding:.5em;margin:.75em 0;border-radius:4px;">
    <p id="announcementChatEmpty"><em>No messages yet.</em></p>
  </div>
  <form id="announcementChatForm" autocomplete="off" style="display:flex;gap:.5em">
    <input id="announcementChatInput" type="text" placeholder="Message the class…" maxlength="2000" disabled style="flex:1">
    <button id="announcementChatSend" type="submit" disabled>Send</button>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script type="module">
  import { javaURI, pythonURI, fetchOptions } from '{{site.baseurl}}/assets/js/api/config.js';

  const COURSE = {{ page.course | jsonify }};
  const GROUP_NAME = `${COURSE}-announcements`;
  const CHAT_SOCKET_PORT = 8589;

  function buildChatSocketEndpoint() {
    const uri = new URL(javaURI);
    if (uri.hostname === 'localhost' || uri.hostname === '127.0.0.1') {
      return `${uri.protocol}//${uri.hostname}:${CHAT_SOCKET_PORT}/ws-chat`;
    }
    return javaURI + '/ws-chat';
  }

  const state = {
    backboneGroupId: null,
    stompClient: null,
    subscription: null,
    connected: false,
    initialized: false,
    currentUserDisplayName: 'You',
    seenKeys: new Set(),
  };

  const statusEl = document.getElementById('announcementChatStatus');
  const messagesEl = document.getElementById('announcementChatMessages');
  const inputEl = document.getElementById('announcementChatInput');
  const sendBtn = document.getElementById('announcementChatSend');
  const formEl = document.getElementById('announcementChatForm');

  function setStatus(text) { statusEl.textContent = text; }

  function formatTimestamp(isoString) {
    if (!isoString) return '';
    const date = new Date(isoString);
    if (Number.isNaN(date.getTime())) return '';
    return date.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  function clearEmpty() {
    const empty = document.getElementById('announcementChatEmpty');
    if (empty) empty.remove();
  }

  function appendMessage({ sender, message, date }) {
    clearEmpty();
    const who = sender === state.currentUserDisplayName ? 'You' : (sender || 'Unknown');
    const when = formatTimestamp(date);
    const line = document.createElement('p');
    const strong = document.createElement('strong');
    strong.textContent = who;
    line.append(strong, document.createTextNode(when ? ` · ${when}: ` : ': '), document.createTextNode(message));
    messagesEl.appendChild(line);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function appendSystem(text) {
    clearEmpty();
    const el = document.createElement('p');
    const em = document.createElement('em');
    em.textContent = text;
    el.appendChild(em);
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function eventKey(event) {
    return [event?.sender || '', event?.date || '', event?.message || ''].join('|');
  }

  async function resolveCurrentUser() {
    try {
      const res = await fetch(`${pythonURI}/api/id`, fetchOptions);
      if (!res.ok) { console.warn('Announcement chat: /api/id HTTP', res.status); return; }
      const user = await res.json();
      state.currentUserDisplayName = user?.name || user?.uid || user?.github || 'You';
    } catch (err) {
      console.warn('Announcement chat: user lookup failed', err);
    }
  }

  async function createGroup() {
    const res = await fetch(`${javaURI}/api/groups`, {
      ...fetchOptions,
      method: 'POST',
      body: JSON.stringify({ name: GROUP_NAME, period: '', course: COURSE, memberIds: [] }),
    });
    if (res.status === 201) {
      const body = await res.json();
      return Number(body?.id) || null;
    }
    // 409 = someone else created it a moment ago; fall through to re-search.
    return null;
  }

  async function resolveBackboneGroup() {
    const cacheKey = `__announcementChatGroupId_${COURSE}`;
    if (window[cacheKey]) { state.backboneGroupId = window[cacheKey]; return true; }

    const url = `${javaURI}/api/groups/search?name=${encodeURIComponent(GROUP_NAME)}`;
    let res;
    try { res = await fetch(url, fetchOptions); }
    catch (err) { console.warn('Announcement chat: group lookup network error', err); return false; }
    if (!res.ok) { console.warn('Announcement chat: group lookup HTTP', res.status); return false; }

    let body;
    try { body = await res.json(); }
    catch (err) { console.warn('Announcement chat: group lookup non-JSON response', err); return false; }

    let match = Array.isArray(body) ? body.find((g) => (g?.name || '') === GROUP_NAME) : body;

    if (!match) {
      const createdId = await createGroup();
      if (createdId) {
        state.backboneGroupId = createdId;
        window[cacheKey] = createdId;
        return true;
      }
      // Someone else beat us to creating it — re-search once.
      try {
        const retryRes = await fetch(url, fetchOptions);
        if (retryRes.ok) {
          const retryBody = await retryRes.json();
          match = Array.isArray(retryBody) ? retryBody.find((g) => (g?.name || '') === GROUP_NAME) : retryBody;
        }
      } catch (err) { /* ignore, handled below */ }
    }

    const id = Number(match?.id);
    if (!id) { console.warn('Announcement chat: could not resolve or create group', GROUP_NAME); return false; }
    state.backboneGroupId = id;
    window[cacheKey] = id;
    return true;
  }

  async function loadHistory() {
    if (!state.backboneGroupId) return;
    try {
      const res = await fetch(`${javaURI}/api/groups/chat/${state.backboneGroupId}/messages`, fetchOptions);
      if (!res.ok) { console.warn('Announcement chat: history HTTP', res.status); return; }
      const messages = await res.json();
      (messages || []).forEach((msg) => {
        const key = eventKey({ sender: msg.name, date: msg.date, message: msg.message });
        if (state.seenKeys.has(key)) return;
        state.seenKeys.add(key);
        appendMessage({ sender: msg.name, message: msg.message, date: msg.date });
      });
    } catch (err) {
      console.warn('Announcement chat: history load failed', err);
    }
  }

  function handleIncoming(event) {
    if (!event || event.context !== 'sendMessageServer') return;
    const key = eventKey(event);
    if (state.seenKeys.has(key)) return;
    state.seenKeys.add(key);
    appendMessage({ sender: event.sender, message: event.message, date: event.date });
  }

  function connect() {
    return new Promise((resolve) => {
      if (state.connected) return resolve(true);
      if (typeof SockJS === 'undefined' || typeof Stomp === 'undefined') { setStatus('unavailable'); return resolve(false); }
      setStatus('connecting…');
      const socket = new SockJS(buildChatSocketEndpoint());
      const client = Stomp.over(socket);
      client.debug = null;
      state.stompClient = client;

      client.connect({}, () => {
        state.connected = true;
        setStatus('connected');
        state.subscription = client.subscribe(`/topic/group/${state.backboneGroupId}`, (frame) => {
          try { handleIncoming(JSON.parse(frame.body)); }
          catch (err) { console.warn('Announcement chat: bad frame', err); }
        });
        resolve(true);
      }, (err) => {
        console.warn('Announcement chat: connection failed', err);
        state.connected = false;
        setStatus('disconnected');
        resolve(false);
      });

      socket.onclose = () => {
        if (!state.connected) return;
        state.connected = false;
        setStatus('disconnected');
        inputEl.disabled = true;
        sendBtn.disabled = true;
      };
    });
  }

  function sendMessage(text) {
    if (!state.connected || !state.stompClient || !state.backboneGroupId) return false;
    const payload = {
      context: 'sendMessage',
      groupId: state.backboneGroupId,
      sender: state.currentUserDisplayName || 'anonymous',
      message: text,
      image: null,
      date: new Date().toISOString(),
    };
    try { state.stompClient.send('/app/groups.chat', {}, JSON.stringify(payload)); return true; }
    catch (err) { console.error('Announcement chat: send failed', err); return false; }
  }

  async function init() {
    if (state.initialized) return;
    state.initialized = true;
    setStatus('loading…');
    await resolveCurrentUser();
    const ok = await resolveBackboneGroup();
    if (!ok) {
      setStatus('unavailable');
      appendSystem('Announcements chat is not available right now.');
      return;
    }
    await loadHistory();
    const connected = await connect();
    if (connected) {
      inputEl.disabled = false;
      sendBtn.disabled = false;
    }
  }

  formEl.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;
    if (sendMessage(text)) inputEl.value = '';
  });

  window.addEventListener('beforeunload', () => {
    try {
      if (state.subscription) state.subscription.unsubscribe();
      if (state.stompClient && state.connected) state.stompClient.disconnect();
    } catch (_) { /* ignore */ }
  });

  init();
</script>
