<!-- Two sidebars are pre-rendered; JS in _layouts/aesthetihawk.html toggles which
     one is visible based on a live ROLE_MENTOR check, so a mentor only ever sees
     the reduced mentor menu and everyone else sees the normal OCS sidebar. -->
<div id="sidebar-role-default">
  {% include aesthetihawk/sidebar-list.html data=site.data.aesthetihawk_sidebar %}
</div>
<div id="sidebar-role-mentor" style="display:none;">
  {% include aesthetihawk/sidebar-list.html data=site.data.aesthetihawk_sidebar_mentor prefix="mentor-" %}
</div>
<script>
  // Apply the last-known role synchronously, before first paint, so navigating
  // between pages doesn't flash the default sidebar for a moment on every click
  // while the real /api/person/get check (in the layout, below) re-verifies it.
  try {
    if (localStorage.getItem('ocsMentorSidebar') === 'mentor') {
      document.getElementById('sidebar-role-default').style.display = 'none';
      document.getElementById('sidebar-role-mentor').style.display = 'block';
    }
  } catch (e) { /* localStorage unavailable; default sidebar stays visible */ }
</script>
