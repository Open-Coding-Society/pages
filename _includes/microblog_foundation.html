<script type="module">
// Import required functions from config
import { pythonURI, javaURI, fetchOptions } from '{{site.baseurl}}/assets/js/api/config.js';
import { SPRING_PASSWORD_RULES, meetsSpringPasswordRules } from '{{site.baseurl}}/assets/js/api/passwordRules.js';

// Microblog panel open/close logic
const microblogPanel = document.getElementById('microblog-panel');
const microblogFab = document.getElementById('microblog-toggle-btn');
const microblogCloseBtn = document.getElementById('microblog-close-btn');

function openMicroblogPanel() {
  microblogPanel.classList.add('open');
  microblogFab.style.display = 'none';
}
function closeMicroblogPanel() {
  microblogPanel.classList.remove('open');
  microblogFab.style.display = '';
}
microblogFab.onclick = openMicroblogPanel;
microblogCloseBtn.onclick = closeMicroblogPanel;

// Guest signup toggle logic
const guestSignupToggle = document.getElementById('guest-signup-toggle');
const guestSignupForm = document.getElementById('guest-signup-form');

guestSignupToggle.onclick = function() {
  if (guestSignupForm.style.display === 'none') {
    guestSignupForm.style.display = 'block';
  } else {
    guestSignupForm.style.display = 'none';
  }
};

// Guest signup handler with auto-login
window.handleGuestSignup = async function(event) {
  event.preventDefault();

  const username = document.getElementById('guest-username').value;
  const password = document.getElementById('guest-password').value;
  const statusMessage = document.getElementById('guest-status-message');
  const submitButton = document.querySelector('.guest-submit-btn');

  // Disable button and show loading state
  submitButton.disabled = true;
  submitButton.textContent = 'Creating Account...';
  statusMessage.textContent = '';
  statusMessage.style.color = '#666';

  const signupData = {
    uid: username,
    password: password
  };

  // A new account needs the shared password rule. A password that breaks it can
  // still log in to a guest account made before the rule, so only skip signup.
  const canSignUp = meetsSpringPasswordRules(password);

  try {
    let accountExists = !canSignUp;

    // Step 1: Try to create guest account using Flask backend
    if (canSignUp) {
      statusMessage.textContent = 'Creating guest account...';
      const signupResponse = await fetch(`${pythonURI}/api/user/guest`, {
        ...fetchOptions,
        method: 'POST',
        body: JSON.stringify(signupData)
      });

      if (!signupResponse.ok) {
        // Account might already exist, so we'll try to login instead
        accountExists = true;
        statusMessage.textContent = 'Account exists, logging in...';
      } else {
        await signupResponse.json();
        statusMessage.textContent = 'Account created! Logging in...';
      }
    } else {
      statusMessage.textContent = 'Logging in...';
    }

    // Step 2: Login with the credentials (whether account was just created or already existed)
    const loginResponse = await fetch(`${pythonURI}/authenticate`, {
      ...fetchOptions,
      method: 'POST',
      body: JSON.stringify(signupData)
    });

    if (!loginResponse.ok) {
      // No account to log in to: a new one needs a password that follows the rule
      throw new Error(canSignUp ? 'Login failed - please check your credentials' : SPRING_PASSWORD_RULES);
    }

    await loginResponse.json();

    // Success - stay on current page
    statusMessage.textContent = 'Success! You are now logged in.';
    statusMessage.style.color = 'green';

    // Hide the form after successful signup/login
    setTimeout(() => {
      guestSignupForm.style.display = 'none';
      // Reset form
      document.getElementById('guest-username').value = '';
      document.getElementById('guest-password').value = '';
      submitButton.disabled = false;
      submitButton.textContent = 'Sign Up & Login';
    }, 2000);

  } catch (error) {
    console.error('Guest signup error:', error);
    statusMessage.textContent = `Error: ${error.message}`;
    statusMessage.style.color = 'red';
    submitButton.disabled = false;
    submitButton.textContent = 'Sign Up & Login';
  }
};
</script>

<!--JavaScript Logic for MicroBlog -->
<script type="module">
// Imports for APIs used on this page
import { fetchPosts, createPost, updatePost, deletePost, createReply, fetchReplies, fetchCurrentUser, setPostResolved, setReplyResolved, isStatusMarker, getResolution, getReplyResolution, normalizeAuthorUids, postChannel, matchesViewFilter } from '/assets/js/api/microblog.js';
import { markMicroblogSeen } from '/assets/js/api/microblog-notifications.js';

// Default Key for New MicroBlog Posts
const pagePermalink = '{{page.permalink}}';
const sfiArchivedPosts = {% if page.sfi_correspondence_microblog %}{{ site.data.sfi_partner_correspondence | jsonify }}{% else %}[]{% endif %};
// Page author uids from front matter (`authors:`): they can resolve posts, and
// get a notification badge for new activity on this page
const pageAuthors = normalizeAuthorUids({{ page.authors | jsonify }});
const currentUserPromise = fetchCurrentUser();

// Opening the panel shows the page's posts, so its new activity counts as
// seen: the Capstone tab's badge drops this page's share.
document.getElementById('microblog-toggle-btn').addEventListener('click', () => markMicroblogSeen(pagePermalink));

// Channel tab and view dropdown (see matchesViewFilter for the filter values)
let activeChannel = 'chat';
let viewFilter = 'active';
// Posts from the last render, keyed by id, for the edit/reply/resolve buttons
let postsById = new Map();

// Resolve / Reopen icons, shared by posts and replies
const resolveIcon = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="14" height="14" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" /></svg>`;
const reopenIcon = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="14" height="14" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M1 4v6h6M3.5 15a9 9 0 1 0 2.1-9.4L1 10" /></svg>`;

function showStatus(text) {
  document.getElementById('microblog-status').textContent = text;
}

// Posts save their page's authors when created; on this page, the current
// front matter also counts so authors added later can still resolve.
function authorsForPost(post) {
  const saved = Array.isArray(post.pageAuthors) ? post.pageAuthors : [];
  const current = post.topicPath === pagePermalink ? pageAuthors : [];
  return [...new Set([...saved, ...current])];
}

// Matches the Flask API: only a post's writer or an Admin may edit or delete it
function canModify(post, user) {
  return Boolean(user) && (post.userId === user.id || user.role === 'Admin');
}

function canResolve(post, user) {
  return Boolean(user) && (post.userId === user.id || authorsForPost(post).includes(user.uid));
}

// A reply's writer can resolve it too, along with everyone who can resolve its post
function canResolveReply(post, reply, user) {
  return Boolean(user) && (reply.userId === user.id || canResolve(post, user));
}

// Channel tabs
document.querySelectorAll('.microblog-channel-tab').forEach(tab => {
  tab.onclick = () => {
    activeChannel = tab.dataset.channel;
    document.querySelectorAll('.microblog-channel-tab').forEach(other => {
      other.classList.toggle('is-active', other === tab);
      other.setAttribute('aria-selected', String(other === tab));
    });
    showStatus('');
    renderMicroblogTable();
  };
});

// View filter dropdown
document.getElementById('microblog-view-select').onchange = async function() {
  viewFilter = this.value;
  const signedOut = !(await currentUserPromise);
  showStatus(viewFilter === 'mine' && signedOut ? 'Sign in to see your posts.' : '');
  renderMicroblogTable();
};

// Create/Edit Modal Functions
function openModal({ mode, post = {} }) {
  document.getElementById('microblog-modal').classList.remove('hidden');
  document.getElementById('modal-title').textContent = mode === 'edit'
    ? 'Edit Microblog Post'
    : `New ${activeChannel === 'suggestions' ? 'Suggestion' : 'Chat Post'}`;
  document.getElementById('post-id').value = post.id || '';
  document.getElementById('topic-id').value = post.topicPath || pagePermalink;
  document.getElementById('content').value = post.content || '';
}
function closeModal() {
  document.getElementById('microblog-modal').classList.add('hidden');
}
document.getElementById('modal-close').onclick = closeModal;
document.getElementById('microblog-modal').onclick = function(e) {
  if (e.target === this) closeModal();
};

// Reply Modal Functions
function openReplyModal(postId) {
  document.getElementById('reply-modal').classList.remove('hidden');
  document.getElementById('reply-post-id').value = postId;
  document.getElementById('reply-content').value = '';
}
function closeReplyModal() {
  document.getElementById('reply-modal').classList.add('hidden');
  document.getElementById('reply-post-id').value = '';
  document.getElementById('reply-content').value = '';
}
document.getElementById('reply-modal-close').onclick = closeReplyModal;
document.getElementById('reply-cancel-btn').onclick = closeReplyModal;
document.getElementById('reply-modal').onclick = function(e) {
  if (e.target === this) closeReplyModal();
};

// Reply Form Submission
document.getElementById('reply-form').onsubmit = async function(e) {
  e.preventDefault();
  const submitButton = this.querySelector('button[type="submit"]');
  if (submitButton.disabled) return;
  submitButton.disabled = true;
  submitButton.textContent = 'Saving...';
  const postId = document.getElementById('reply-post-id').value;
  const content = document.getElementById('reply-content').value;
  const topicPath = pagePermalink || (window.location ? window.location.pathname : 'default');
  
  try {
    await createReply({ postId, content, topicPath });
    closeReplyModal();
    renderMicroblogTable(); // Refresh to show new reply
  } catch (err) {
    alert('Error posting reply: ' + err.message);
  } finally {
    submitButton.disabled = false;
    submitButton.textContent = 'Reply';
  }
};

// Load replies for a specific post
async function loadRepliesForPost(postId) {
  try {
    const repliesData = await fetchReplies(postId);
    const allReplies = repliesData.replies || repliesData || [];
    // Resolve/reopen markers are status, not conversation
    const replies = Array.isArray(allReplies) ? allReplies.filter(reply => !isStatusMarker(reply)) : [];
    const user = await currentUserPromise;
    // The freshly fetched replies (markers included) decide each reply's status
    const listedPost = postsById.get(String(postId));
    const post = listedPost ? { ...listedPost, replies: Array.isArray(allReplies) ? allReplies : [] } : null;
    if (replies.length > 0) {
      // Find the row for this post
      const postRow = document.querySelector(`#post-row-${postId}`);
      if (postRow) {
        // Check if replies section already exists
        let repliesRow = document.querySelector(`#replies-row-${postId}`);
        if (!repliesRow) {
          // Create a new row for replies
          repliesRow = document.createElement('tr');
          repliesRow.id = `replies-row-${postId}`;
          repliesRow.className = 'replies-row';
          postRow.insertAdjacentElement('afterend', repliesRow);
        }
        
        // Format replies HTML
        const repliesHtml = replies.map(reply => {
          const replyDate = reply.timestamp ? new Date(reply.timestamp).toLocaleString() : '';
          // Replies without an id (or a post) can't be told apart, so they get no status
          const status = post && reply.id != null ? getReplyResolution(post, reply.id, authorsForPost(post)) : null;
          return `
            <div class="reply-item microblog-reply${status && status.resolved ? ' is-resolved' : ''} ml-4 mt-2 p-2 rounded border-l-4 border-green-500">
              <div class="microblog-reply-byline text-sm text-gray-600">
                <span>${escapeHtml(reply.userName || 'Anonymous')} - ${replyDate}</span>
                ${status ? replyStatusHtml(post, reply, status, user) : ''}
              </div>
              <div class="mt-1">${escapeHtml(reply.content || '')}</div>
            </div>
          `;
        }).join('');
        
        repliesRow.innerHTML = `
          <td colspan="2" class="text-left p-2">
            <div class="replies-container">
              <strong class="text-sm text-gray-600">Replies (${replies.length}):</strong>
              ${repliesHtml}
            </div>
          </td>
        `;
      }
    }
  } catch (error) {
    console.error(`Error loading replies for post ${postId}:`, error);
  }
}

// A reply's Resolved badge and Resolve/Reopen button. While the post is
// resolved its replies are too, so they get a badge but no button.
function replyStatusHtml(post, reply, status, user) {
  const badge = status.resolved
    ? `<span class='microblog-resolved-badge'>${status.withPost ? 'Resolved with post' : 'Resolved'}</span>`
    : '';
  if (status.withPost || !canResolveReply(post, reply, user)) return badge;
  const button =
    `<button class='reply-resolve-btn microblog-resolve-btn microblog-resolve-btn--reply${status.resolved ? ' is-reopen' : ''}' ` +
    `data-post-id='${post.id}' data-reply-id='${escapeHtml(String(reply.id))}' ` +
    `title='${status.resolved ? 'Reopen this reply' : 'Mark this reply as resolved'}'>` +
    `${status.resolved ? reopenIcon : resolveIcon}<span>${status.resolved ? 'Reopen' : 'Resolve'}</span></button>`;
  return badge + button;
}

// Utility function to escape HTML
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Save Button Listner for Update and Create
document.getElementById('microblog-form').onsubmit = async function(e) {
  e.preventDefault();
  const submitButton = this.querySelector('button[type="submit"]');
  if (submitButton.disabled) return;
  submitButton.disabled = true;
  submitButton.textContent = 'Saving...';
  const id = document.getElementById('post-id').value;
  const topicPath = document.getElementById('topic-id').value;
  const content = document.getElementById('content').value;
  try {
    // API calls to Update and Create Posts
    if (id) {
      await updatePost({ id, content, topicPath });
    } else {
      // Save the open channel, and the page's authors so they can resolve the
      // post from any page
      const data = pageAuthors.length ? { channel: activeChannel, pageAuthors } : { channel: activeChannel };
      await createPost({ content, topicPath, data });
    }
    closeModal();
    renderMicroblogTable();
  } catch (err) {
    alert('Error saving post: ' + err.message);
  } finally {
    submitButton.disabled = false;
    submitButton.textContent = 'Save';
  }
};

// MicroBlog Table Manager
async function renderMicroblogTable() {
    const container = document.getElementById('microblog-playground');
    try {
        // Determine filter mode and pass page if needed
        let pageArg = undefined;
        if (window.__microblogFilterMode === undefined || window.__microblogFilterMode === 'page') {
          // Use current page as filter; fallback to location.pathname or a default string
          pageArg = window.location ? window.location.pathname : 'default';
        }
        // API call to Read former Posts
        let data;
        try {
          data = await fetchPosts(pageArg);
        } catch (error) {
          if (!{{ page.sfi_correspondence_microblog | default: false | jsonify }}) throw error;
          data = { microblogs: [] };
        }
        if ({{ page.sfi_correspondence_microblog | default: false | jsonify }} && pageArg !== undefined) {
          const archived = sfiArchivedPosts.map((item, i) => ({
            id: 'sfi-archived-' + i,
            userName: item.author,
            timestamp: item.date + 'T12:00:00',
            characterCount: item.message.length,
            topicPath: 'SFI partnership correspondence',
            content: item.message,
            archived: true
          }));
          data.microblogs = archived.concat(data.microblogs || []);
        }
        const user = await currentUserPromise;
        const posts = (data.microblogs || []).map(post => ({ ...post, resolution: getResolution(post, authorsForPost(post)) }));
        postsById = new Map(posts.map(post => [String(post.id), post]));
        const visiblePosts = posts.filter(post =>
          postChannel(post) === activeChannel && matchesViewFilter(post, viewFilter, user));
        // SVG icons for Create (+) and Edit (pencil)
        const createIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="microblog-filter-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>`;
        const editIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="microblog-filter-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536M9 13l6.586-6.586a2 2 0 112.828 2.828L11.828 15.828a4 4 0 01-2.828 1.172H7v-2a4 4 0 011.172-2.828z" /></svg>`;
        const replyIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="microblog-filter-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" /></svg>`;
        const deleteIcon = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>`;
        // Single page icon (default)
        const pageIcon = `<span class="microblog-filter-icon microblog-filter-page" id="page-icon" title="Show this page only"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><rect x="6" y="4" width="12" height="16" rx="2" fill="white" stroke="white" stroke-width="1.5"/><rect x="8" y="6" width="8" height="12" rx="1" fill="#9333ea" stroke="white" stroke-width="1.5"/></svg></span>`;
        // Many pages icon (secondary option)
        const manyPagesIcon = `<span class="microblog-filter-icon microblog-filter-many" id="many-pages-icon" title="Show all pages"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><g><rect x="7" y="15" width="10" height="6" rx="2" fill="#60a5fa" stroke="white" stroke-width="1.2"/><rect x="5" y="11" width="12" height="6" rx="2" fill="#2563eb" stroke="white" stroke-width="1.2"/><rect x="3" y="7" width="12" height="6" rx="2" fill="#1e40af" stroke="white" stroke-width="1.2"/></g></svg></span>`;
        // Create and Page Icons
        const controlsInfo = `
          <span id="filter-icons" class="microblog-filter-controls">
            <button id="create-btn" class="microblog-btn microblog-btn-create" title="Create Post">${createIcon}</button>
            ${pageIcon}
            ${manyPagesIcon}
          </span>
        `;

        // Table: Keys and Special Formatting
        const analytics = [
          { key: 'userName' },
          { key: 'timestamp', format: ts => {
              if (!ts) return '';
              const d = new Date(ts);
              if (isNaN(d)) return ts;
              return d.toLocaleString();
            }
          },
          { key: 'characterCount', format: v => `Count: ${v}` }
        ];
        const message = [
          { key: 'topicPath', format: v => `Topic: ${v}` },
          { key: 'content' }
        ];

        // Table: columns
        let head = `
            <thead>
                <tr>
                    <th style="width:30%">Analytics</th>
                    <th>Message</th>
                </tr>
            </thead>
        `;

        // Table: rows; generated from microblog data
        let genBody = '';
        visiblePosts.forEach(post => {
            const analyticsCell = analytics.map(f => {
              let value = post[f.key] ?? '';
              if (f.format) value = f.format(value);
              return `<div>${value}</div>`;
            }).join('');
            // Resolve/Reopen shows only for the post's writer and the page authors
            const isResolved = post.resolution.resolved;
            const resolveBtn = canResolve(post, user)
              ? `<button class='resolve-btn microblog-resolve-btn${isResolved ? ' is-reopen' : ''}' data-id='${post.id}' title='${isResolved ? 'Reopen this post' : 'Mark as resolved'}'>` +
                `${isResolved ? reopenIcon : resolveIcon}<span>${isResolved ? 'Reopen' : 'Resolve'}</span></button>`
              : '';
            const resolvedBadge = isResolved ? `<span class='microblog-resolved-badge'>Resolved</span>` : '';
            // Topic (+ Resolved badge), then content, then one row of post actions
            const messageCell = message.map(f => {
              let value = post[f.key] ?? '';
              if (f.format) value = f.format(value);
              if (f.key === 'topicPath') {
                const archivedNote = post.archived ? '<small>(archived; read-only)</small>' : '';
                return `<div class='microblog-post-topic'><span>${value}</span>${resolvedBadge}${archivedNote}</div>`;
              }
              return `<div>${value}</div>`;
            }).join('') +
              // Archived SFI emails are read-only: no reply, edit, delete or resolve
              (post.archived ? '' :
              `<div class='microblog-post-actions'>` +
                `<button class='reply-btn microblog-icon-btn' data-id='${post.id}' title='Reply' aria-label='Reply to post'>${replyIcon}</button>` +
                (canModify(post, user)
                  ? `<button class='edit-btn microblog-icon-btn' data-id='${post.id}' title='Edit' aria-label='Edit post'>${editIcon}</button>` +
                    `<button class='delete-btn microblog-icon-btn is-danger' data-id='${post.id}' title='Delete' aria-label='Delete post'>${deleteIcon}</button>`
                  : '') +
                resolveBtn +
              `</div>`);
            genBody += `<tr id="post-row-${post.id}"><td class="text-left">${analyticsCell}</td><td class="text-left">${messageCell}</td></tr>`;
        });

        // Table: body
        let body = `
        <tbody>
            ${genBody}
        </tbody>
        `;


        // Table: set container with scrollable wrapper
        container.innerHTML = `
        <div class="max-h-[45vh] sm:max-h-[60vh] lg:max-h-[70vh] overflow-y-auto" style="max-height:70vh;">
          <table id="microblog-table" border="1" style="border-collapse:collapse; margin-top:1em; width:100%;">
              ${head}
              ${body}
          </table>
        </div>
        `;

        // Wait for DOM update, then initialize DataTables
        setTimeout(async () => {
        // JQuery micro-table Bottom and Top control updates
        if (window.jQuery && $('#microblog-table').length) {
            $('#microblog-table').DataTable({
                initComplete: function() {
                    // Top controls (Show entries)
                    const lengthDiv = document.querySelector('.dataTables_length');
                    if (lengthDiv) {
                      lengthDiv.style.display = 'flex';
                      lengthDiv.style.alignItems = 'center';
                      lengthDiv.insertAdjacentHTML('afterbegin', controlsInfo);
                      lengthDiv.querySelectorAll('*').forEach(el => {
                        el.style.marginTop = '0';
                        el.style.marginBottom = '0';
                      });
                      const createBtn = document.getElementById('create-btn');
                      if (createBtn) createBtn.onclick = () => openModal({ mode: 'create' });
                    }
                    // Bottom controls (prefix to info)
                    const infoDiv = document.querySelector('.dataTables_info');
                    if (infoDiv) {
                      infoDiv.style.display = 'flex';
                      infoDiv.style.alignItems = 'center';
                      infoDiv.innerHTML = controlsInfo + infoDiv.innerHTML;
                      // Only bind if not already bound (avoid duplicate IDs)
                      const btns = infoDiv.querySelectorAll('#create-btn');
                      btns.forEach(btn => btn.onclick = () => openModal({ mode: 'create' }));
                    }
                    // Filter mode logic (default: page, people = all)
                    window.__microblogFilterMode = 'page';
                    function setFilterMode(mode) {
                      window.__microblogFilterMode = mode;
                      // Update icon backgrounds for visual feedback
                      const pageIconEl = document.getElementById('page-icon');
                      const manyPagesIconEl = document.getElementById('many-pages-icon');
                      if (pageIconEl && manyPagesIconEl) {
                        if (mode === 'page') {
                          pageIconEl.style.background = '#9333ea'; // purple
                          manyPagesIconEl.style.background = '#2563eb'; // blue
                          pageIconEl.style.opacity = '1';
                          manyPagesIconEl.style.opacity = '0.5';
                        } else {
                          manyPagesIconEl.style.background = '#2563eb';
                          pageIconEl.style.background = '#9333ea';
                          manyPagesIconEl.style.opacity = '1';
                          pageIconEl.style.opacity = '0.5';
                        }
                      }
                      // Re-render table with new filter
                      renderMicroblogTable();
                    }
                    setTimeout(() => {
                      // Bind ALL filter icons (top and bottom)
                      document.querySelectorAll('#page-icon').forEach(el => {
                        el.onclick = () => setFilterMode('page');
                      });
                      document.querySelectorAll('#many-pages-icon').forEach(el => {
                        el.onclick = () => setFilterMode('people');
                      });
                      // Only set default filter if not already set
                      if (!window.__microblogFilterModeInitialized) {
                        window.__microblogFilterModeInitialized = true;
                        setFilterMode('page');
                      }
                    }, 0);
                }
            });
            // Bind edit buttons using event delegation so it works on all pages
            $('#microblog-table').off('click', '.edit-btn').on('click', '.edit-btn', function() {
              const id = $(this).data('id');
              const post = postsById.get(String(id));
              openModal({ mode: 'edit', post });
            });
            // Bind reply buttons
            $('#microblog-table').off('click', '.reply-btn').on('click', '.reply-btn', async function() {
              const postId = $(this).data('id');
              openReplyModal(postId);
            });
            // Bind delete buttons (own posts, or any post for an Admin)
            $('#microblog-table').off('click', '.delete-btn').on('click', '.delete-btn', async function() {
              const post = postsById.get(String($(this).data('id')));
              if (!post || !canModify(post, user)) return;
              if (!confirm('Delete this post and its replies? This cannot be undone.')) return;
              this.disabled = true;
              try {
                await deletePost(post.id);
                showStatus('Post deleted.');
                renderMicroblogTable();
              } catch (err) {
                this.disabled = false;
                alert('Error deleting post: ' + err.message);
              }
            });
            // Bind resolve/reopen buttons
            $('#microblog-table').off('click', '.resolve-btn').on('click', '.resolve-btn', async function() {
              const post = postsById.get(String($(this).data('id')));
              if (!post || !canResolve(post, user)) return;
              this.disabled = true;
              try {
                await setPostResolved(post.id, !post.resolution.resolved, user.uid);
                showStatus(post.resolution.resolved ? 'Post reopened. It is back under Active.' : 'Post resolved. Find it under History.');
                renderMicroblogTable();
              } catch (err) {
                this.disabled = false;
                alert('Error updating post status: ' + err.message);
              }
            });
            // Bind reply resolve/reopen buttons (each reply's own status)
            $('#microblog-table').off('click', '.reply-resolve-btn').on('click', '.reply-resolve-btn', async function() {
              const post = postsById.get(String(this.dataset.postId));
              const replyId = this.dataset.replyId;
              const reply = post && (post.replies || []).find(r => String(r.id) === replyId);
              if (!post || !reply || !canResolveReply(post, reply, user)) return;
              const resolved = !this.classList.contains('is-reopen');
              this.disabled = true;
              try {
                await setReplyResolved(post.id, replyId, resolved, user.uid);
                showStatus(resolved ? 'Reply resolved.' : 'Reply reopened.');
                renderMicroblogTable();
              } catch (err) {
                this.disabled = false;
                alert('Error updating reply status: ' + err.message);
              }
            });

            // Load and display replies for each post
            for (const post of visiblePosts) {
              if (post.archived) continue; // not stored in Flask, so no replies to fetch
              await loadRepliesForPost(post.id);
            }
        }
        }, 0);
    } catch (error) {
        container.innerHTML = `<div style="color:red;">Failed to load microblog posts: ${error.message}</div>`;
    }
}
renderMicroblogTable();
</script>
