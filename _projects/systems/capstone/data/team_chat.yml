# The words of a capstone page's team chat (_includes/capstone-team-chat.html, js/team-chat.js,
# js/team-mentors.js). {group} is the team group's name. The code has no visible text of its own.
title: Team chat
lead: The team and its mentors talk here. It's the same group the team has in Messages.
loading: Loading the team chat…
signIn: Sign in to see the team chat.
unavailable: The team chat isn't available right now.
notMember: "This chat is for {group}'s members and mentors. A member can add you in Messages."
mentorWaiting: "You'll see this chat once a member of {group} adds you and the group has at least 2 members who aren't mentors."
notFound: "There's no group named {group} in Messages yet. Make it in Messages, then add the team."
openInMessages: Open in Messages
# Words for the chat itself (Messages' embed); any key from the Messages README's embed table.
embed:
  emptyHint: Say hi to your team.
  placeholder: Message the team…
# The team's mentors, under the chat (js/team-mentors.js). {name} is a mentor's name.
mentors:
  title: Mentors
  none: No mentors yet.
  findLabel: Find a mentor
  findHint: Search by name. Only accounts a teacher has verified as mentors show up.
  search: Search
  noResults: No verified mentors match that name.
  add: Add
  remove: Remove
  added: "{name} is now in the team chat."
  removed: "{name} was taken out of the team chat."
  # Spring's reason when it refuses a change (MentorRules in Spring).
  reasons:
    mentor_team_too_small: "The group needs at least 2 members who aren't mentors before it can have a mentor. Add your teammates in Messages first."
    team_manages_mentors: "Only the group's members or a teacher can add or remove its mentor."
    mentor_class_group: "Mentors can't be in class groups."
    mentor_cannot_manage: "Mentors can't add or remove people."
    failed: "Couldn't save that change. Try again."
