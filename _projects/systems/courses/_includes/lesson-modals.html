<!-- LESSON PLAYER MODALS -->

<!-- Timeline modal overlay -->
<div class="timeline-modal-overlay" id="timeline-modal-overlay"></div>

<!-- Timeline modal (mobile only) -->
<div class="timeline-modal" id="timeline-modal">
  <div class="timeline-modal-header">
    <div class="course-panel-actions course-mobile-nav">
      {% include course-nav.html %}
      <button class="timeline-close-btn" id="timeline-close-btn" type="button" aria-label="Close course navigation" aria-controls="timeline-modal" title="Close course navigation">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
    </div>
    <h3>{% include course-title.html %}</h3>
  </div>
  <div class="timeline-modal-content" id="timeline-modal-content">
    <!-- Sprint cards will be populated by JavaScript -->
  </div>
</div>
