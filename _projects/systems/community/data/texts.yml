# Every word the Community system shows. js/*.js reads them with Texts.say("section.key"),
# and the page renders some with Liquid. An organization's own words (its name, its channel
# and series titles) are in its setup file, such as data/demo.yml. {org} is the setup's
# short name; other {slots} are filled in by the code.

app:
  title: Member app
  demo: Demo
  made_up: "Everything here is made up: the organization, its members, series, messages, documents and polls. Nothing you post is saved or sent anywhere. It stays in this browser until you reload."
  built_from: "Built by Open Coding Society students from OCS systems: Messages, the course announcements and calendar, the microblog's polls and the theme engine."
  controls: Demo controls
  viewing_as: Viewing as
  look: Look
  look_brand: "{org} colors"
  look_preset: "OCS {name}"
  person_option: "{name} ({role})"
  sections: Sections

