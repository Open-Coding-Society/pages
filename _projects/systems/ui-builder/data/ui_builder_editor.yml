# UI Builder editor strings, published to _data/ui_builder_editor.yml and written only on the
# editor and canvas pages (ui_builder_data.html editor=true). readRegistry() merges this map into
# text.editor, so the modules read them as textOf(registry, 'editor.<key>', vars).
# {name} placeholders are filled by textOf; quote every value that has one.

