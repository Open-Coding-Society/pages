name: Create assignments from frontmatter

on:
  push:
    branches:
      - main
      - master

jobs:
  create-assignments:
    # Only the main site has the pages-bot secrets. On a fork this job
    # fails on every push and would create production rows if a fork ever
    # added the secrets. Skip it everywhere except Open-Coding-Society/pages.
    if: github.repository == 'Open-Coding-Society/pages'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Run create assignments script
        env:
          BASE_URL: https://spring.opencodingsociety.com
          PAGES_BOT_UID: ${{ secrets.PAGES_BOT_UID }}
          PAGES_BOT_PASSWORD: ${{ secrets.PAGES_BOT_PASSWORD }}
        run: |
          python3 scripts/create_assignments_from_frontmatter.py \
            --root . \
            --base-url "$BASE_URL" \
            --uid "$PAGES_BOT_UID" \
            --password "$PAGES_BOT_PASSWORD"