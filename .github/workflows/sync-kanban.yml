name: Sync kanban board

on:
  schedule:
    - cron: "0 13 * * *" # daily, 6am Pacific / 1pm UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate kanban section
        env:
          GH_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
        run: python3 scripts/sync_kanban.py

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/capstone/2026-09-11-shoreline-volunteer-capstone.md
          git commit -m "Sync kanban board from project #8"
          git push
