# AP Computer Science A course framework -- four units, 53 topics.
#
# Topic numbers and titles are the College Board's (2025 revision). One source of
# truth for two screens: the Unit and Chapter dropdowns on a lesson's submission
# form read it, and the submissions dashboard groups its rows by it. A lesson can
# name its own default with `unit:` and `chapter:` in front matter.
#
# "4.2" means unit 4, chapter 2 -- Introduction to Using Data Sets.
