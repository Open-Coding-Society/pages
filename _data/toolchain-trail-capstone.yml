Title: "OCS Gamified Toolchain Trail"
TeamName: "The7Blueprints"
Logo: "capstone/toolchain_trail_logo.jpg"
Badge: "'Level two' game to set up tools."
Board:
  url: "https://github.com/orgs/the7blueprints/projects/3/views/1"
Overview: "Students are extending the OCS onboarding system to guide students through development-environment setup and verify that their machines are ready for classroom development. The project includes a cross-platform Python verification agent, tool and project checks, GitHub identity, remediation feedback, and integration with the OCS Analytics System. Verification and gameplay results will flow into the existing Java/Spring/SQL backend, where student activity can contribute to status, grading, progress, and regression tracking. The goal is to provide students and teachers with a working-status view of development environments while connecting machine-level activity to the broader OCS learning system."
Team: ["Hope Fune", "Anishka Sangvi", "Kailyn Sanford", "Meryl Chen", "Anika Marathe", "Avantika Chittari", "Laya Balaji"]
Stages: [{title: "Stage 1: Development Environment Verification", description: "Improve the existing verifyTools.sh Bash script so it can determine whether a student's development environment is properly configured.", points: ["Find the repository automatically and verify required tools, files, and project configuration.", "Give clear remediation steps and a passed, warning, or failed summary with the correct exit code.", "Keep checks secure, platform-aware, and documented in the README."]}, {title: "Stage 2: Python Onboarding Agent", description: "Replace the Bash verification script with a cross-platform Python onboarding agent that produces structured JSON for every verification.", points: ["Verify development tools, GitHub access, repository setup, and project runtime across supported platforms.", "Record structured results and connect them to each student's GitHub identity.", "Track progress, retries, and regressions to gate levels and surface students who need help."]}]
Stations: [{name: "Terminal Town Gate", purpose: "Shell basics and cloning the class repo"}, {name: "Compiler Canyon Forge", purpose: "Python and Ruby runtimes with pip and Bundler"}, {name: "Editor Isle Tower", purpose: "VS Code/Cursor and WSL configuration"}, {name: "Git Village Hall", purpose: "Git installation and configuration"}, {name: "GitHub Gateway Arch", purpose: "GitHub authentication and repository connectivity"}, {name: "Build Bridge", purpose: "Project build and runtime verification"}, {name: "Integration Summit", purpose: "Final end-to-end verification", gated: true}]
MapStructure: ["The player starts at the entrance of a road that loops around the map.", "Six buildings sit along the road in clockwise order, each representing one development-environment station.", "Integration Summit is the locked final stop; it opens only after all six stations are complete.", "Each station has a unique building, floating nameplate, purpose icons, wooden sign, and completion feedback.", "Integration Summit initially appears desaturated and locked."]
ProgressTracking: ["Complete", "In Progress", "Locked", "Gated", "Warning/Stuck"]
BuildingStates: [{name: "Locked", description: "Desaturated with unlit torches and no glow."}, {name: "Active", description: "Full color with lighting and a glowing entrance."}, {name: "Stuck", description: "Active appearance with a subtle warning glow."}, {name: "Complete", description: "Full color with a steady glow and completion indicator."}]
NPCFeedback: "A new NPC dialogue system appears when a student completes a station. The popup contains a pixel-art NPC portrait, a short informational or fun-fact text, and a Continue button, matching the existing sidebar for visual consistency."
RequiredAssets: ["Seven building sprites", "Icons representing each development tool or station", "Seven NPC portraits", "Status icons for completion, progress, warnings, and locked areas"]
OverallGoal: "Transform development-environment setup from a complicated technical process into a guided, measurable, and interactive learning experience."
SystemFlow: ["Environment Verification", "Automated Onboarding", "Progress Tracking", "Gamified Learning", "Teacher Dashboard Evidence"]
RecentChanges:
  - title: "Choose your system"
    points:
      - "Players pick Windows, macOS, or Linux at the start and can change it any time."
      - "Every station then shows the right steps for that system: WSL Ubuntu on Windows, Terminal and Homebrew on macOS, apt on Linux."
      - "Each system also has a one-command setup check that only reads versions and settings; it never installs or changes anything."
  - title: "Toolchain agent"
    points:
      - "The agent is a small Python program on the student's own computer, because a web page cannot run programs there."
      - "Students pair it once: the game shows a one-time code that works for 5 minutes, the student pastes it into the agent, and it then runs in the background for the whole trail, even while they install tools in the same terminal."
      - "At each station the game asks the agent for that station's checks, such as the pages clone, Python, and Git. The agent reports what it finds, and the server decides pass or fail."
      - "A failed check shows the exact fix for the student's system. If pairing is not possible, a Practice Check lets students paste terminal output for feedback."
  - title: "Spline barriers and road"
    points:
      - "Added invisible barriers along paths and below the score bar."
      - "Moved the road beside the buildings; players start at its entrance."
      - "The road now loops around the map, with stations in clockwise order."
  - title: "Sound settings"
    points:
      - "Added voice, volume, speed, and pitch controls."
      - "Settings persist across levels and reloads without changing each level's voice style."
      - "Choose English, Chinese, or Spanish, plus fun voice effects."
      - "Removed the extra effects menu from dialogue."
  - title: "Saving setup check results"
    points:
      - "One command checks tools, saves results locally, and sends them to the server."
      - "Results appear in-game with status, fixes, date, time, and duration."
      - "Latest results are stored; manual paste is still available."
      - "An AI summary highlights missing setup items."
UpcomingWork:
  - title: "Progress alerts"
    points:
      - "Show student progress and flag failed checks or stalled activity."
  - title: "Bring the setup flow to other levels"
    points:
      - "Add guided steps, automatic results, and a teacher view to other levels."
  - title: "Block progression after setup failure"
    points:
      - "On failure, block progress and flash a large red “0.55” until fixed."
