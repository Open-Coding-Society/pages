# CSA course meta data
course:
  code: CSA
  title: "CSA - Computer Science A"
  subtitle: "Systems, Architecture"
  mission: "AP Computer Science A (CSA 1, CSA 2, DS 2) is an in-depth course focusing on programming, algorithms, and data structures. Students prepare for AP exam by architecting and building systems, focusing on code quality, becoming an algorithmic problem solver, establishing fluency in JavaScript, Java and OOP."
  progression_key: 15
  learning_journey:
    - "Java OOP Fundamentals"
    - "Classes and Objects"
    - "Inheritance & Polymorphism"
    - "Arrays & ArrayLists"
    - "Recursion Patterns"
    - "Spring Framework Projects"
  zone_title: "CSA Zone - Computer Science A"

Sprint1:
  title: Java Onboarding 
  description: In this Sprint, students will become familiar with Java types, booleans, iteration, recursion, using, and writing objects. Student teaching labs will introduce AP-required aspects of Java while learning the Spring Framework. This will teach key Java concepts while learning JWT login system, a Rest Controller, Plain Old Java Objects (POJOs), Object Relational Model (ORM), and Java Persistence API (JPA).
  start: 0
  end: 4
  0:
    theme: "Onboarding & Readiness"
    goals:
      - "Tool Setup"
      - "Scrum Habits"
      - "Portfolio Foundations"
  1:
    theme: "AP Introduction"
    goals:
      - "MCQ Topics"
      - "Lesson Building"
      - "Mastery through Teaching"
  2:
    theme: "Java / Spring Basics"
    goals:
      - "Anatomy of a Spring Boot Project"
      - "Spring Boot REST, JPA, ORM, POJO"
      - "ThymeLeaf Coding Concepts"
  3:
    theme: "Spring Boot Challenges"
    goals:
      - "Spring MVC/Admin UI"
      - "Full Stack Development"
      - "Depth through Presentation"
  4:
    theme: "Retrospective and Assessment"
    goals:
      - "Reflect on Sprint"
      - "Learn Self and Peer Assessment"
      - "Set Future Knowledge Goals"
Sprint2:
  title: Java / Spring Full Stack Web Development
  description: Students will master Frontend to Backend Programming using the Java/Spring Framework. 
  illustration: *web_dev_layers
  start: 5
  end: 8
Sprint3:
  title: Team Project for N@tM
  description: In this Sprint, students will continue to become familiar with Java development as they immerse themselves in  Web Development using the Spring Framework. Coding will focus on RESTful APIs, receiving requests, working with data using SQLite, and responding to requests.  Students will pick a Full Stack Web Development project, and work in teams to build it out, including all layers, and how to use ThymeLeaf to create an Admin UI.  The goal is to have the project working and deployed on AWS by the end of this Sprint.
  start: 9
  end: 12
Sprint4:
  title: Integration, Fontend, MVC Layers, and FRQs
  description: Trimester 2 begins with four weeks of Integration and FRQs.  At the center of work is the College Board FRQs and Frontend/Backend and MVC layers.  Consider a Mini-project that Integrates Trimister 1 work with another team, adds an FRQ, and performs Unit 10 Sorting and Analysis. For each peace, provide JavaScript Visualization; ThymeLeaf administration, Backend Java Sorting, Inheritance, and Polymorphic behavior.  Also, teach the College Board FRQ topic to the class.  Ideas spans at least two teams or eight students.
  start: 13
  end: 16
Sprint5:
  title: AP Java FRQ Topics & OCS Platform Enhancement
  description: In this Sprint, students will master AP CSA Java requirements by teaching a selected topic to their peers and building or improving features on the Open Coding Society (OCS) platform. Required topics include Methods & Control Structures, Arrays, ArrayLists, Classes, 2D Arrays, Searching, and Sorting. Each student will deliver a lesson on their chosen topic, complete coding hacks from other groups' topics, and contribute to OCS features for student tracking and feedback. Teaching and platform work are integrated, with all students demonstrating mastery through both instruction and hands-on development.
  start: 17
  end: 20 
  17:
    theme: "Prep and OCS Requirements"
    goals:
      - "Pick Teaching Topics"
      - "Define Lesson, HW Standards"
      - "Develop OCS Features"
  18:
    theme: "Peer Teaching"
    goals:
      - "Present 1-Topic (prototype)"
      - "Grading/Feedback 1-Topic"
      - "Provide Feedback"
      - "Revise OCS Features"
  19:
    theme: "Final Teaching"
    goals:
      - "Present 4-Topics (final)"
      - "Assign Student Assessment"
      - "Capture Preliminary Student Data in OCS"
  20:
    theme: "Summative Assessment"
    goals:
      - "Analyze Student Data"
      - "Capture Final Student Data in OCS"
      - "Present to Teacher"
Sprint6:
  title: OCS Enhancement & N@tM Feedback
  description: In this Sprint, students may choose to continue enhancing the OCS platform or propose and prototype a new project based on their interests and skills. The focus is on creativity, design, and technical growth—whether through OCS development or a new passion project. Students should document their design process, make technical decisions, and present their work for peer and instructor feedback. Consider frontend design, database modeling, API plans, JWT designs, big data solutions, and future usefulness. Weekly live reviews and feedback will support project evolution.
  start: 21
  end: 24
  21:
    theme: "Design Checkpoint"
    goals:  
      - "Research Technologies"
      - "Database Models (draw.io)"
      - "Frontend UI/UX (html/css)"
      - "API Basics (postman)"
  22:
    theme: "Functional Checkpoint"
    goals:  
      - "Issue Burndown"
      - "Backend Admin UI"
      - "Frontend Interactivity"
      - "API Testing (postman)"
  23: 
    theme: "Final Prototype Push"
    goals:    
      - "Final Features"
      - "Testing/Debugging"
      - "Project Presentation"
      - "N@tM Feedback"
  24: 
    theme: "N@tM Retrospective"
    goals:    
      - "Peer Review"
      - "Instructor Feedback"
      - "Next Steps Planning"
Sprint7: 
  title: Data Structures using OCS Project
  description: A focus on Data Structures that relate to the AP exam. A key requirement is to make your own Algorithmic sorting video. The theme is to produce work that can help you pass the AP Exam and improve your Passion Project. Each student must cover key concepts from the Four AP FRQ types, contain a key Data Structure, and utilize Sorting.
  illustration: *data_structures
  start: 25
  end: 29
Sprint8:
  title: AP Weeks, Study Sessions
  description: Students will lead several study sessions (20-minute test, followed by review) the week before the exam. In any break in study, students will transition activities back to their final project.
  illustration: *frq_types
  start: 30
  end: 33
Sprint9:
  title: OCS Project v2.0 and N@tM
  description: Wrap up your preferred project and data structures. There will be an opportunity to contribute and be published to the Open Coding Society. If your project is selected, then you will receive a high 'A' on the final project.
  start: 34
  end: 37