Title: "OCS in a Kit"
TeamName: "OCS in a Kit"
Logo: "capstone/cccs-security-logo.png"
Tagline: "We package Open Coding Society so another school can ship it under its own name, with the security and account systems it needs already built in."
Description: "OCS in a Kit packages Open Coding Society so other schools can run it under their own branding. The team works in three sectors: the kit itself, which moves school domains, account types, and policy values out of the code and into one data file; security, which protects sign-in and isolates student code; and backend, which activates, verifies, and administers accounts and mentors."
