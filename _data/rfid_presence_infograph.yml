# RFID + Camera-Correlated Classroom Presence System — Infographic
Title: "RFID + Camera-Correlated Classroom Presence System"
Description: "A low-cost Raspberry Pi UHF RFID system that tracks laptop (device) presence at the doorway and correlates it with an existing face-scanning camera system to determine true student presence, period by period."

