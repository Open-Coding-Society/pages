Sections:
  - title: "Strengths vs Problems"
    subtitle: "What already works, and what gets in a family's way"
    items:
      - "Works: free for members, twice a month, with refreshments covered by community sponsors."
      - "Works: strong community support, from the City of Poway and the Poway Sheriff's Department to sponsors like General Atomics and Unified ESports League."
      - "Works: a clear FAQ that covers aides, service animals, age limits, and photo consent."
      - "Problem: club dates are listed out of order, with no year and no start or pickup time."
      - "Problem: no phone number or email anywhere on the site."
      - "Problem: pages are named /blank-1 through /blank-6, and volunteering and the waiver are separate steps."

  - title: "Ideas We Are Bringing From Our First Capstone"
    subtitle: "What carries over from Friends of Poway Seniors, and what doesn't"
    items:
      - "Bringing: accessibility first, with big text, text-size buttons, and hands-free Nod to select."
      - "Bringing: multiplayer Bingo rooms and the room-code pattern, which Trivia Live reuses, plus saved progress and the tap-only profile survey."
      - "Bringing: OCS login and roles, direct messages with volunteers, and the microblog."
      - "Leaving behind: the scam-defense trainer, which was built for older adults."

  - title: "The Direction"
    subtitle: "Four goals behind every game"
    items:
      - "Together: every game works on the big screen at club night and on members' own phones."
      - "Easy-read: plain words and pictures, usable without help."
      - "Connected: members, families, and volunteers share one account."
      - "Safe: messages only with volunteers and staff, and photo consent respected."

