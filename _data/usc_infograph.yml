Title: "Unified Social Club"
Description: "Unified Social Club gives adults with special needs in Poway a free, safe place to make friends: board and card games, arts and crafts, karaoke, and sports, twice a month at the Mickey Cafagna Community Center. The club is warm and well supported, but its website makes families hunt for dates, times, and how to sign up. We are rebuilding it so members, families, and volunteers can find a club date, register, and stay connected, with accessibility built in from the start."

Topics:
  - title: "Club Dates and Registration"
    phase: "Round 1"
    link: "https://www.unifiedsocialclub.com/event-list"
    linkLabel: "See Their Club Dates"
    subtitle: "Find the next club date and sign up in one place"
    keyPoints:
      - "A calendar of club dates in order, with the year, start and end time, and pickup time"
      - "Register for a date with spaces for an aide, a family member, or a service animal"
      - "Shows when a date is full, and sends a reminder before each club night"
      - "Volunteers and staff add or edit dates without touching code"
    tech:
      - "Events API"
      - "RSVP with limits"
      - "OCS calendar"
      - "Email reminders"
    description: "Today the dates show up out of order, without a year or a time, so families have to guess. A real events system fixes that, and the registration form keeps the details the club already asks for: aides, service animals, and photo consent."
    impact:
      - "Families know exactly when to drop off and pick up"
      - "The club knows who is coming and when a date is full"
    status: "Planned"
    team:
