
title: "North County Special Needs Community Foundation"
subtitle: "2026-27 Capstone Infographic"

quote: "The North County Special Needs Community Foundation provides vital community outreach and support for individuals with developmental disabilities and their families. Our capstone project focuses on modernizing its website to improve accessibility, navigation, and community engagement."

github: "https://github.com/NCSNCF-Redesign/NCSNCF-FE"

summary:
  main_problems: "The original website lacks visual cohesion across its pages, has an underutilized event calendar, and offers limited interactive features for community engagement, resource discovery, and donor interactions."

  original_url: "https://www.ncspecialneedsfoundation.com/"

  redesigned_url: "https://ncsncf-redesign.github.io/NCSNCF-FE/"

  project_direction: "Our team is redesigning the NCSNCF website with a consistent visual style, improved navigation, and organized community information. We are also exploring interactive features such as an event calendar, personalized resource navigator, community surveys, and dynamic announcements."

board:
  title: "Project Kanban Board"
  url: "https://github.com/orgs/NCSNCF-Redesign/projects/2"
  filter: "NCSNCF Team"

strengths_and_improvements:
  - title: "Community Impact & Mission"
    type: "strength"
    accent: true
    description: "The foundation supports individuals with developmental disabilities and their families by promoting community inclusion, friendships, educational opportunities, and independent living."
    links:
      - label: "Visit Original Website"
        url: "https://www.ncspecialneedsfoundation.com/"
        btn_class: "alert-green"

  - title: "Website Redesign & Visual Consistency"
    type: "improvement"
    accent: true
    description: "Our team is developing a redesigned website with updated page layouts, consistent styling, clearer navigation, and an improved user experience."
    links:
      - label: "View Our Redesign"
        url: "https://ncsncf-redesign.github.io/NCSNCF-FE/"
        btn_class: "alert-green"

  - title: "Community Events & Calendar"
    type: "improvement"
    accent: false
    description: "The original event calendar is underutilized. Our project aims to improve how families discover upcoming community events, programs, and activities."
    links:
      - label: "Original Events Page"
        url: "https://www.ncspecialneedsfoundation.com/events-calendar"
        btn_class: "alert-yellow"

  - title: "Interactive Community Features"
    type: "improvement"
    accent: false
    description: "We are exploring features such as personalized resource filtering, community surveys, user profiles, and dynamic announcements to make the website more useful for families."
    links:
      - label: "Explore Our Project"
        url: "https://ncsncf-redesign.github.io/NCSNCF-FE/"
        btn_class: "alert-green"

  - title: "Frontend Development & Collaboration"
    type: "strength"
    accent: true
    description: "Our team uses GitHub, Jekyll, HTML, CSS, and JavaScript to develop the redesigned website. We organize development through GitHub issues, pull requests, and a Kanban board."
    links:
      - label: "View GitHub Repository"
        url: "https://github.com/NCSNCF-Redesign/NCSNCF-FE"
        btn_class: "alert-green"

