        url: "https://ncsncf-redesign.github.io/NCSNCF-FE/"
        btn_class: "alert-green"

  - title: "Frontend Development & Collaboration"
    type: "strength"
    accent: true
    description: "Our team uses GitHub, Jekyll, HTML, CSS, and JavaScript to develop the website. We collaborate through GitHub issues, pull requests, and a shared Kanban board."
