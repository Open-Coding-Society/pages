
title: "North County Special Needs Community Foundation"
subtitle: "2026-27 Capstone Infographic"

quote: "The North County Special Needs Community Foundation supports individuals with developmental disabilities and their families through community programs, educational opportunities, and social connections. Our capstone project focuses on improving the foundation's website to make its resources and services more accessible."

github: "https://github.com/NCSNCF-Redesign/NCSNCF-FE"

summary:
  main_problems: "The original website has inconsistent page designs, limited interactive features, and an underutilized event calendar. These challenges make it harder for visitors to discover programs, resources, and opportunities for community involvement."

  original_url: "https://www.ncspecialneedsfoundation.com/"

  redesigned_url: "https://ncsncf-redesign.github.io/NCSNCF-FE/"

  project_direction: "Our team is creating a more organized and accessible website with consistent styling, improved navigation, and clearer community information. We are also exploring new features to improve event discovery, resource access, and community engagement."

board:
  title: "Project Kanban Board"
  url: "https://github.com/orgs/NCSNCF-Redesign/projects/2"
  filter: "NCSNCF Team"

