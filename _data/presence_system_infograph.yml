# Classroom Presence System Infographic
Title: "Classroom Presence System"
Description: "Traditional classroom attendance systems typically rely on a single observation or event to determine whether a student is present, which can be inaccurate and inefficient in determining analytics of actual time in classroom. Our system is intended to provide continuous and accurate tracking of student presence."

