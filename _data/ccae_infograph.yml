title: "California Center for the Arts, Escondido"
subtitle: "2026-27 Capstone Infographic"
quote: "The Escondido Arts has sophisticated elements which will be good to learn as we progress toward our journey of ideation and improvement. They have strength in Events and Ticket sales, lacking in personalization and information navigation."
github: "https://github.com/ccae-redesign-team/CCAE-FE"

summary:
  main_problems: "The website is aesthetically busy and navigation is complicated and hard to follow. It also has different domains for some pages, and is overall difficult to navigate and find what someone might be looking for."
  original_url: "https://artcenter.org/"
  project_direction: "This capstone project aims to refurbish the California Center For The Performing Arts Escondido website to be more streamlined, organized, and less busy. It will overhaul the search feature to be more intelligent, fix any visual bugs, introduce a dynamic and artistic design, and will replace generic walls of text with something more interactive."

board:
  title: "Project Kanban Board"
  url: "https://github.com/orgs/ccae-redesign-team/projects/2" 
  filter: "CCAE Team"

strengths_and_improvements:
  - title: "Dynamic UI"
    type: "strength"
    accent: true
    description: "A changing background creates visual interest and professional polish."
    links:
      - label: "View Example"
        url: "https://artcenter.org/"
        btn_class: "alert-green"

  - title: "Navigation Clarity"
    type: "improvement"
    accent: false
    description: "Site-in-Site transitions are inconsistent and confusing for users."
    links:
      - label: "Museum Entry Point"
        url: "https://www.ccaemuseum.org/"
        btn_class: "alert-yellow"

  - title: "Backend Integration"
    type: "strength"
    accent: true
    description: "Data sourcing is evident; events page pulls live ticket inventory and concerts page pulls from real dates. One thing that could be improved is having the Buy Tickets button placed directly on each concert performance grid image for easily accessibility. Some of the events when clicked on also have the buy tickets button twice."
    links:
      - label: "Events Page"
        url: "https://artcenter.org/events/"
        btn_class: "alert-green"
      - label: "Concerts Page"
        url: "https://artcenter.org/concerts-performances/"
        btn_class: "alert-green"
      - label: "Two Ticket Btn"
        url: "https://artcenter.org/event/kintsugi-workshop-2/2026-09-12/"
        btn_class: "alert-red"

  - title: "Information Architecture"
    type: "improvement"
    accent: false
    description: "Multiple nested 'About' pages reduce discoverability and clarity."
    links:
      - label: "About Pages"
        url: "https://artcenter.org/about/"
        btn_class: "alert-yellow"

  - title: "Header Network"
    type: "improvement"
    accent: false
    description: "The smaller black header and main-header have links to the same pages."
    links:
      - label: "Header Above"
        url: "https://artcenter.org/about/"
        btn_class: "alert-red"

  - title: "Basic Bugs and Polish"
    type: "improvement"
    accent: false
    description: "Sitemap footer redirects nowhere, some links don't work like the contact link at the end of the privacy policy."
    links:
      - label: "Scroll Down"
        url: "https://artcenter.org/about/"
        btn_class: "alert-red"
      - label: "Privacy Page"
        url: "https://artcenter.org/about/privacy/"
        btn_class: "alert-red"

