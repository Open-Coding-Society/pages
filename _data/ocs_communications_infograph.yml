    description: "Every piece of OCS Communications — announcements, week threads, DMs — is one Spring application away from actually being reachable. Right now it only runs locally; this team gets it onto a real, hosted deployment. Scope also covers the pre-existing Groups admin page, since the chat feature now auto-creates rows in the same table it manages."
    impact:
      - "Moves the whole platform from 'works on my machine' to a real hosted deployment"
      - "Groups admin page stays a reliable surface as automated group creation scales up"

