Title: "OCS Communications"
Description: "A communications platform for Open Coding Society: class-wide announcements, per-week discussion threads, and private direct messages, all running on one real-time backend. What started as three separate Sprint 1 tasks — host the Spring app, add chat to the CSA course page, build messaging — is really one product: give every OCS course a live communications layer instead of a static page."

