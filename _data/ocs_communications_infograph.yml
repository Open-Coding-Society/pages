  - title: "Direct Messages"
    subtitle: "OCS Communications, next: private 1:1 conversations"
    emoji: "✉️"
    gradient: "linear-gradient(135deg, #7c2d12, #f97316)"
    link: "https://github.com/UGRC-CSA/Pages/issues/4"
    status: "Design Complete"
    team:
      - "Perry (Scrum Master)"
      - "Syowns"
      - "Leon"
    keyPoints:
      - "New backend domain (mvc/directmessages), not a repurposed group channel"
      - "Access control enforced at the database query layer — non-negotiable for a private feature"
      - "Reuses the existing /ws-chat STOMP broker under a new /topic/dm/{id} namespace"
      - "Sender identity resolved from the authenticated session, not a client-supplied string"
    tech:
      - "Spring Boot"
      - "JPA / Hibernate"
      - "STOMP over WebSocket"
      - "JWT auth"
    description: "The private half of OCS Communications, sitting next to the open-by-design class channels. Full technical design (issue #27) covers the entity model, REST surface, and the one hard requirement: only the two participants in a conversation can ever read it."
    impact:
      - "Completes the platform: broadcast (announcements), group (week threads), and private (DMs)"
      - "Establishes the query-time access-control pattern future private features can follow"
