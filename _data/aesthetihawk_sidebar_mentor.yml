# Mentor-only additions. The mentor sidebar is the student sidebar minus the
# student-only items (grades, analytics, submissions, bathroom pass -- see the
# `exclude` param in _includes/aesthetihawk/sidebar.html) with this section
# appended. Shown only for a signed-in ROLE_MENTOR.
- section: Mentor
  items:
    - id: capstone
      title: Capstone Projects
      url: /capstone/
      icon: |
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
    - id: my-applications
      title: My Applications
      # The #my-projects hash auto-opens that tab on load (see the Mentor
      # My-Projects Module script in _layouts/dashboard.html) -- otherwise a
      # mentor landing on /dashboard would see the generic Preferences tab
      # first and never notice their applied/assigned projects.
      url: /dashboard#my-projects
      icon: |
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
