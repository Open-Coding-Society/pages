literature:
  - title: "Speculative Decoding"
    type: "Paper"
    url: "https://arxiv.org/pdf/2211.17192"
    description: "A small model drafts tokens. The serving model accepts or rejects them. Goal: 60+ tokens per second."
  - title: "YaRN"
    type: "Paper"
    url: "https://arxiv.org/pdf/2309.00071"
    description: "Extends a model's context window past its training length."
  - title: "LLM Model Card"
    type: "Model card"
    url: "https://huggingface.co/Qwen/Qwen3.8-27B"
    description: "One candidate LLM we are evaluating: size, license, and intended use."
  - title: "TD-Pipe"
    type: "Paper"
    url: "https://arxiv.org/pdf/2506.10470"
    description: "Splits prefill and decode across pipeline stages so GPUs stay busy and throughput goes up."
  - title: "PipeMax"
    type: "Paper"
    url: "https://arxiv.org/pdf/2605.02189"
    description: "Offline LLM inference on commodity GPU servers, closer to the hardware OCS actually has."
  - title: "FlexGen"
    type: "Paper"
    url: "https://arxiv.org/pdf/2303.06865"
    description: "High-throughput generation on one GPU by offloading weights to CPU and disk when VRAM is tight."
  - title: "HeteGen"
    type: "Paper"
    url: "https://arxiv.org/pdf/2403.01164"
    description: "Splits inference across CPU and GPU on machines that are short on resources."
  - title: "PowerInfer"
    type: "Paper"
    url: "https://arxiv.org/pdf/2312.12456"
    description: "Serves an LLM on a consumer GPU by keeping hot neurons on GPU and cold ones on CPU."
  - title: "PagedAttention / vLLM"
    type: "Paper"
    url: "https://arxiv.org/pdf/2309.06180"
    description: "Pages the KV cache like virtual memory so serving does not waste GPU RAM."
  - title: "Orca"
    type: "Paper"
    url: "https://www.usenix.org/system/files/osdi22-yu.pdf"
    description: "Iteration-level scheduling so many student requests can share one running model."
  - title: "AWQ"
    type: "Paper"
    url: "https://arxiv.org/pdf/2306.00978"
    description: "Quantizes weights using activation stats so large models fit in less VRAM with less quality loss."
  - title: "GPTQ"
    type: "Paper"
    url: "https://arxiv.org/pdf/2210.17323"
    description: "Post-training quantization for GPT-style models. Another way to shrink models for our GPUs."
  - title: "Baseten Inference Engineering"
    type: "Book"
    url: "https://www.baseten.co/inference-engineering/"
    description: "Practical guide to the serving stack: kernels, metrics, and production inference."
  - title: "TTFT, TPS, ITL"
    type: "Metrics"
    url: "https://github.com/Open-Coding-Society/OCS-Intelligence/issues/4"
    description: "Time to first token, tokens per second, and inter-token latency. These are the numbers we track."
  - title: "OCS Intelligence issue #4"
    type: "Tracker"
    url: "https://github.com/Open-Coding-Society/OCS-Intelligence/issues/4"
    description: "GitHub issue that tracks literature, metrics, and serving goals for this project."

stages:
  - slug: phase-1
    title: "Phase 1 — Build the rack, run inference, open the stream"
    navLabel: "Phase 1: Rack, inference & access"
    navKicker: "Phase 1"
    status: "In progress"
    summary: "Physically stand up the donated GPU rack, put Ollama and llama.cpp in production, and stream answers to student harnesses on other networks — with keys."
    workstreams:
      - title: "Physically build the GPU rack"
        detail: "Take the donated 8× GTX 1070 rig from hardware to a machine that stays powered, cooled, and ready to host a model for the class."
      - title: "Inference engineering"
        detail: "Run open-weight models in production with Ollama and llama.cpp so students get useful answers, not a lab curiosity."
      - title: "Websocket and live stream"
        detail: "Let users send requests through their harnesses from separate networks. The session should feel live — a stream — not a demo that only works in the same room."
      - title: "Auth and keys"
        detail: "Issuing and managing keys is part of access. A shared brain without a front door is not a school service."
    doneWhen:
      - "A student on another network can send a request through their harness and get a streamed reply."
      - "Keys can be issued and managed so access is intentional."
      - "About five people can use it at once without OOM, a hard crash, or token speed falling to a crawl."
    impact:
      - "The donated rack becomes a public good inside OCS, not a closet of unused cards."
      - "Coursework can assume a capable model without assuming a credit card."
      - "Electricity is the bill. The subscription is the thing we stop needing."
    goals:
      - "Assemble the donated 8× GTX 1070 production rack."
      - "Serve open models with Ollama and llama.cpp (Nikhil, Adi, Mihir)."
      - "Stream to harnesses across networks, with key issuance and management."
      - "Hold about five concurrent users without OOM or a crawl."
    literatureTitles:
      - "Baseten Inference Engineering"
      - "Orca"
      - "LLM Model Card"
    showDonation: true
    showResearchQuestion: 1
    showJustification: true
    showRigs: true
    tech:
      - "Donated 8× GTX 1070"
      - "Ollama / llama.cpp"
      - "Live stream"
      - "Keys & auth"

  - slug: phase-2
    title: "Phase 2 — Deploy, watch, and make sure the class can get in"
    navLabel: "Phase 2: Deploy, monitor & access"
    navKicker: "Phase 2"
    status: "Next"
    summary: "Put the service in front of real students, watch it under load, and keep it reachable so access is a class right — not a lucky connection."
    workstreams:
      - title: "Deployment"
        detail: "Treat the rack as a service the school can point at — not a one-team experiment that vanishes after a demo."
      - title: "Monitoring"
        detail: "Notice when answers stall, when memory gets tight, or when the stream drops, before a whole class feels it."
      - title: "Many people at once"
        detail: "Classroom use is the test. The service should remain usable when several students are mid-assignment together."
      - title: "Every student has a path in"
        detail: "Access is the impact. If some students still need a paid tool because they cannot reach OCS Intelligence, the question is unfinished."
    doneWhen:
      - "The live service is the one students are told to use, not a screenshot of a local run."
      - "We can see whether it is healthy when more than one person is on it."
      - "Getting a key and reaching the stream is a normal student step, not a favor."
    impact:
      - "A full period can share one donated brain instead of sixteen private subscriptions."
      - "Teachers can assign AI-supported work without asking who paid this month."
      - "OCS keeps the cost story simple: hardware was given; we pay to keep the lights on."
    goals:
      - "Deploy the Phase 1 service as the student-facing path."
      - "Watch it closely enough to know it still works when several people use it."
      - "Make sure every OCS student can get access — not only the team that built the rack."
    literatureTitles:
      - "TTFT, TPS, ITL"
      - "OCS Intelligence issue #4"
    showResearchQuestion: 2
    tech:
