literature:
  - title: "Speculative Decoding"
    type: "Paper"
    url: "https://arxiv.org/pdf/2211.17192"
    description: "A small model drafts tokens. The serving model accepts or rejects them. Goal: 60+ tokens per second."
  - title: "YaRN"
    type: "Paper"
    url: "https://arxiv.org/pdf/2309.00071"
    description: "Extends a model's context window past its training length."
  - title: "Qwen3.8 27B Model Card"
    type: "Model card"
    url: "https://huggingface.co/Qwen/Qwen3.8-27B"
    description: "One candidate we are evaluating: size, license, and intended use."
  - title: "TD-Pipe"
    type: "Paper"
    url: "https://arxiv.org/pdf/2506.10470"
    description: "Splits prefill and decode across pipeline stages so GPUs stay busy and throughput goes up."
  - title: "PipeMax"
    type: "Paper"
    url: "https://arxiv.org/pdf/2605.02189"
    description: "Offline LLM inference on commodity GPU servers, closer to the hardware OCS actually has."
  - title: "FlexGen"
    type: "Paper"
    url: "https://arxiv.org/pdf/2303.06865"
    description: "High-throughput generation on one GPU by offloading weights to CPU and disk when VRAM is tight."
  - title: "HeteGen"
    type: "Paper"
    url: "https://arxiv.org/pdf/2403.01164"
    description: "Splits inference across CPU and GPU on machines that are short on resources."
  - title: "PowerInfer"
    type: "Paper"
    url: "https://arxiv.org/pdf/2312.12456"
    description: "Serves an LLM on a consumer GPU by keeping hot neurons on GPU and cold ones on CPU."
  - title: "PagedAttention / vLLM"
    type: "Paper"
    url: "https://arxiv.org/pdf/2309.06180"
    description: "Pages the KV cache like virtual memory so serving does not waste GPU RAM."
  - title: "Orca"
    type: "Paper"
    url: "https://www.usenix.org/system/files/osdi22-yu.pdf"
    description: "Iteration-level scheduling so many student requests can share one running model."
  - title: "AWQ"
    type: "Paper"
    url: "https://arxiv.org/pdf/2306.00978"
    description: "Quantizes weights using activation stats so large models fit in less VRAM with less quality loss."
  - title: "GPTQ"
    type: "Paper"
    url: "https://arxiv.org/pdf/2210.17323"
    description: "Post-training quantization for GPT-style models. Another way to shrink models for our GPUs."
  - title: "Baseten Inference Engineering"
    type: "Book"
    url: "https://www.baseten.co/inference-engineering/"
    description: "Practical guide to the serving stack: kernels, metrics, and production inference."
  - title: "TTFT, TPS, ITL"
    type: "Metrics"
    url: "https://github.com/Open-Coding-Society/OCS-Intelligence/issues/4"
    description: "Time to first token, tokens per second, and inter-token latency. These are the numbers we track."
  - title: "OCS Intelligence issue #4"
    type: "Tracker"
    url: "https://github.com/Open-Coding-Society/OCS-Intelligence/issues/4"
    description: "GitHub issue that tracks literature, metrics, and serving goals for this project."

