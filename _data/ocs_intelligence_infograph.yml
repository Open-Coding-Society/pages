      - "Monitoring"
      - "Classroom access"
      - "Shared fairness"

Topics:
  - title: "A shared mind for the class"
    subtitle: "Turn a donated GPU rack into a dependable companion for coding — then keep the door open when the class shows up."
    visualTitle: "Two implementation phases"
    stack:
