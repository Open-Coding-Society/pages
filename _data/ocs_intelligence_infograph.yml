# OCS Intelligence LLM Capstone Infographic
Title: "OCS Intelligence LLM"
Description: "Reduce dependence on paid AI subscriptions enabling student development and growth."

Year: "2026-2027"

problemStatement:
  kicker: "The problem"
  title: "Capable AI help is rationed by who can pay"
  body: "The strongest coding assistants live behind a monthly subscription. A student whose family can afford that seat gets a tireless tutor and pair programmer; a student who can't gets the same assignment and a worse starting point. That gap has nothing to do with effort or ability — it tracks a credit card."

donation:
  kicker: ""
  title: "Eight GTX 1070s, donated to OCS"
  body: "This capstone starts with generosity. OCS was donated a GPU rig with eight GTX 1070s — enough local compute to host open-weight models instead of renting them. The work is not to buy intelligence. It is to turn a gifted machine into a classroom service: assembled, served, and reachable from the networks students already use."
  costLine: "Donated hardware reduces purchase costs. The proposed hybrid service also needs a budget for electricity, cloud services, storage, networking, and maintenance."

researchQuestionsNote: "These are living questions, not a fixed spec. As Phase 0 research turns up better serving tricks or a stronger candidate model, and as Phase 1/2 surface real load numbers, the questions below get revised rather than treated as settled on day one."

researchQuestions:
  - label: "Research question 1"
    priority: "Primary — answer first, everything else depends on it"
    question: "How do we turn donated GPU hardware into a shared open LLM that OCS students can actually code with — without a paid subscription?"
    endpoint: "Answered when a student on another network can send a request through their harness and get a streamed reply, with keys issued and managed, without picking one specific model forever."
    facts:
      - label: "Stakes"
        text: "Coursework shouldn't depend on who can afford a subscription."
      - label: "Gift"
        text: "A donated rack with 8× GTX 1070s lets OCS host open-weight models locally instead of renting them."
      - label: "Aim"
        text: "Stand the rack up, run inference with Ollama and llama.cpp, and stream answers to student harnesses on other networks — with keys, not hope."
  - label: "Research question 2"
    priority: "Secondary — only answerable once RQ1's service exists"
    question: "Once the service exists, how do we keep it fair, visible, and usable when many students need it at once?"
    endpoint: "Answered when ~5 concurrent users hold steady without OOM, a hard crash, or token speed falling to a crawl, and every OCS student — not just the builders — can get a key."
    facts:
      - label: "Fairness"
        text: "Every OCS student should be able to reach the same service, not a lucky few on the same LAN."
      - label: "Load"
        text: "A small class wave — about five people at once — should not empty VRAM, crash the API, or drag token speed to a crawl."
      - label: "Trust"
        text: "Deployment and monitoring prove the promise: it works as intended, and it is still there when the room fills up."

harnesses: "Students connect from tools they already use — OpenRouter, Pi, or Claude Code — over a live stream, not a one-off laptop demo."

communication:
  kicker: "Staying accountable"
  title: "How we keep mentors in the loop"
  body: "Progress is written down as it happens, not summarized right before grading. Anyone mentoring this capstone can follow it without asking for a status meeting."
  channels:
    - label: "Microblog posts"
      text: "Dated write-ups under this capstone (the Phase 1/Phase 2 pages themselves) log what shipped, what broke, and what changed about the research questions."
    - label: "GitHub issues"
      text: "Literature, metrics, and serving goals live in Open-Coding-Society/OCS-Intelligence issue #4, updated as the questions evolve."

