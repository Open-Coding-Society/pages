    workstreams:
      - title: "Problem framing"
        detail: "Write down what's actually broken (paid AI access gates coursework) before deciding how to fix it, so the hardware work in Phase 1 answers a real question instead of just being a fun build."
      - title: "Literature review"
        detail: "Read the serving, quantization, and scheduling papers that make consumer GPUs behave like a shared production service, and keep the reading list current as the project runs."
      - title: "Candidate model search"
        detail: "Compare open-weight models against public benchmarks for coding ability and footprint, and stay ready to swap in a better one — no single model is the final answer."
