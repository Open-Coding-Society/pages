      - "Phase 1 puts models on the rack and streams them to harnesses with keys."
      - "Phase 2 proves that service under real student use."
      - "Nobody should need a paid subscription for the same chance to think with a model."
      - "The meter that remains is electricity."
    description: "Paid LLM seats split a classroom. This capstone answers with a gift and a duty: host open models on a donated 8× GTX 1070 rig, let students reach them from their own networks, and keep that promise when many people are on at once. The research is not “can GPUs run a model.” It is “can OCS give every student the same intelligence without charging them for it.”"
    candidateModel: "We still compare open models that can live on this hardware. The target is a coding companion good enough that a subscription is optional, not required."
