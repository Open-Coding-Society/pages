Topics:
  - title: "A shared mind for the class"
    subtitle: "Turn a donated GPU rack into a dependable companion for coding — then keep the door open when the class shows up."
    visualTitle: "Three implementation phases"
    stack:
      - "Phase 0: Problem framing, literature, candidate model"
      - "Phase 1: Rack, inference, stream"
      - "Phase 2: Deploy, monitor, include everyone"
    keyPoints:
      - "Phase 0 names the problem and picks a direction before any hardware is touched."
      - "The hardware was given. The work is to make it a service."
      - "Phase 1 puts models on the rack and streams them to harnesses with keys."
      - "Phase 2 proves that service under real student use."
      - "Nobody should need a paid subscription for the same chance to think with a model."
      - "The meter that remains is electricity."
    description: "The hard part isn't turning on a GPU — it's turning eight second-hand GTX 1070s (8GB VRAM each, no NVLink) into something that behaves like one reliable service. Model weights that don't fit on a single card, a KV cache that grows with every concurrent student, and a class of ~25 people hitting it in the same ten minutes all compete for the same limited memory. The research question is whether consumer-grade, donated hardware can be engineered around those limits well enough that nobody in the room notices the difference from a paid API."
    candidateModel: "We are not locking into one model. Candidates get re-evaluated as better open weights ship — the target is whichever coding companion fits this hardware and stays good enough that a subscription is optional, not required."
    tech:
      - "Donated GPU rack"
      - "Open-weight LLMs"
      - "Student harnesses"
      - "Electricity-only cost"
    impact:
      - "Cut paid AI subscriptions for school work by giving every student core coding help — chat, autocomplete, review — at electricity cost instead of a monthly fee."
      - "Give more students the same chance to use a capable model."
      - "Honor the donation by putting the machine in front of the class."
      - "Learn what it takes to keep a shared service kind under load."
    status: "Phase 0 research underway"
    audience: "OCS students — every student, not only the builders"
    link: "https://artificialanalysis.ai/models/qwen3-8-27b"
    linkLabel: "View candidate benchmarks"
