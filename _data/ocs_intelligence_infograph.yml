# OCS Intelligence Capstone Infographic
Title: "OCS Intelligence"
Description: "Build shared open-weight LLM infrastructure on OCS hardware so students can code without a paid subscription."

Year: "2026-2027"

researchQuestions:
  - label: "Question 1"
    question: "How do we host capable open LLMs so OCS students can code with them, without a paid subscription?"
    facts:
      - label: "Problem"
        text: "LLM subscriptions are expensive. Not everyone in OCS can use frontier models."
      - label: "Goal"
        text: "Cut paid AI subscriptions for school work."
      - label: "Solution"
        text: "Host open-weight models locally. The only ongoing cost is electricity."
  - label: "Question 2"
    question: "How do we host and serve open LLMs so the stack stays fast, reliable, and stable for real users?"
    facts:
      - label: "Performance"
        text: "Keep TTFT low and tokens per second high enough for a class."
      - label: "Reliability"
        text: "The API, tunnel, and GPUs stay up and recover when something fails."
      - label: "Stability"
        text: "Share load across 8 GPUs so the server does not OOM or stall."

harnesses: "Harnesses: OpenRouter, Pi, or Claude Code."

