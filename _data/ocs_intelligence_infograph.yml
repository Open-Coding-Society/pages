# OCS Intelligence LLM Capstone Infographic
Title: "OCS Intelligence LLM"
Description: "Reduce dependence on paid AI subscriptions enabling student development and growth."

Year: "2026-2027"

donation:
  kicker: ""
  title: "Eight GTX 1070s, donated to OCS"
  body: "This capstone starts with generosity. OCS was donated a GPU rig with eight GTX 1070s — enough local compute to host open-weight models for students who cannot, or should not have to, pay for a frontier subscription. The work is not to buy intelligence. It is to turn a gifted machine into a classroom service: assembled, served, and reachable from the networks students already use."
  costLine: "After the gift, the only ongoing cost is electricity."

researchQuestions:
  - label: "Research question 1"
    question: "How do we turn donated GPU hardware into a shared open LLM that OCS students can actually code with — without a paid subscription?"
    facts:
      - label: "Problem"
        text: "Capable models sit behind monthly fees. Coursework then depends on who can pay, not on who is in the class."
      - label: "Gift"
        text: "A donated rack with 8× GTX 1070s lets OCS host open-weight models locally instead of renting them."
      - label: "Aim"
        text: "Stand the rack up, run inference, and stream answers to student harnesses on other networks — with keys, not hope."
  - label: "Research question 2"
    question: "Once the service exists, how do we keep it fair, visible, and usable when many students need it at once?"
    facts:
      - label: "Fairness"
        text: "Every OCS student should be able to reach the same service, not a lucky few on the same LAN."
      - label: "Load"
        text: "A small class wave — about five people at once — should not empty VRAM, crash the API, or drag token speed to a crawl."
      - label: "Trust"
        text: "Deployment and monitoring prove the promise: it works as intended, and it is still there when the room fills up."

harnesses: "Students connect from tools they already use — OpenRouter, Pi, or Claude Code — over a live stream, not a one-off laptop demo."

teams:
  - name: "Team 1"
    members: "Nikhil, Adi & Mihir"
    role: "Production inference on the donated rack — Ollama and llama.cpp, plus the path students use to reach it."
  - name: "Team 2"
    members: "Yash Squared & Anvay"
    role: "Testing and experiments on Rig 2 so production stays stable while ideas get tried."

