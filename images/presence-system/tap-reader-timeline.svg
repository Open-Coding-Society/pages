        <line x1="75" y1="96" x2="1125" y2="96" fill="rgb(0, 0, 0)" stroke="rgb(111, 127, 153)" stroke-width="6px" stroke-dasharray="12px, 10px"></line>
        <circle cx="75" cy="96" r="28" fill="rgb(79, 157, 98)" stroke-width="1px"></circle>
        <path d="M62 97 l9 9 l17 -19" fill="none" stroke="rgb(255, 255, 255)" stroke-width="6px" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle cx="225" cy="96" r="22" fill="rgb(223, 231, 239)" stroke="rgb(22, 33, 59)" stroke-width="5px"></circle>
        <circle cx="375" cy="96" r="22" fill="rgb(223, 231, 239)" stroke="rgb(22, 33, 59)" stroke-width="5px"></circle>
        <circle cx="525" cy="96" r="22" fill="rgb(223, 231, 239)" stroke="rgb(22, 33, 59)" stroke-width="5px"></circle>
