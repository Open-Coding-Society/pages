        <text x="75" y="160" text-anchor="middle" fill="rgb(22, 33, 59)" stroke-width="1px" font-size="20px" font-weight="700" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">Ordered</text>
        <text x="75" y="188" text-anchor="middle" fill="rgb(90, 103, 125)" stroke-width="1px" font-size="20px" font-weight="400" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">RC522 kit</text>
        <text x="225" y="160" text-anchor="middle" fill="rgb(22, 33, 59)" stroke-width="1px" font-size="20px" font-weight="700" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">Parts arrive</text>
        <text x="375" y="160" text-anchor="middle" fill="rgb(22, 33, 59)" stroke-width="1px" font-size="20px" font-weight="700" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">First read</text>
        <text x="375" y="188" text-anchor="middle" fill="rgb(90, 103, 125)" stroke-width="1px" font-size="20px" font-weight="400" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">wire + test card</text>
        <text x="525" y="160" text-anchor="middle" fill="rgb(22, 33, 59)" stroke-width="1px" font-size="20px" font-weight="700" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">reader.py</text>
        <text x="525" y="188" text-anchor="middle" fill="rgb(90, 103, 125)" stroke-width="1px" font-size="20px" font-weight="400" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">integration</text>
