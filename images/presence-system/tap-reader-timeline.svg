        <text x="825" y="160" text-anchor="middle" fill="rgb(22, 33, 59)" stroke-width="1px" font-size="20px" font-weight="700" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">Assembly</text>
